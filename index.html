// Calcula a comissão de um produto contratado a partir do seu valor de venda.
// legalFixo = valor fixo em R$ pago ao departamento que executa (não depende do valor de venda).
// combinadoPct = mesma pessoa faz venda + execução, comissão em % do valor de venda.
// vendaPct = comissão de quem vendeu, em % do valor de venda.
// execucaoPct/regularizacaoPct = comissão de quem executa/regulariza, em % do valor de venda (quando não há legalFixo).
function calcComissao(produto, valor) {
  const v = parseFloat(valor) || 0;
  const com = produto.comissao || {};
  if (com.primeiroHonorarioPct) {
    const pct = parseFloat(com.primeiroHonorarioPct) || 0;
    return { tipo: "primeiroHonorario", pct, valor: (v * pct) / 100 };
  }
  const partes = [];
  if (com.legalFixo) partes.push({ papel: "Execução (Legal, fixo)", pct: null, valor: parseFloat(com.legalFixo) || 0 });
  if (com.combinadoPct) partes.push({ papel: "Combinado (venda + execução)", pct: parseFloat(com.combinadoPct) || 0, valor: (v * (parseFloat(com.combinadoPct) || 0)) / 100 });
  if (com.vendaPct) partes.push({ papel: "Venda", pct: parseFloat(com.vendaPct) || 0, valor: (v * (parseFloat(com.vendaPct) || 0)) / 100 });
  if (com.execucaoPct) partes.push({ papel: "Execução", pct: parseFloat(com.execucaoPct) || 0, valor: (v * (parseFloat(com.execucaoPct) || 0)) / 100 });
  if (com.regularizacaoPct) partes.push({ papel: "Regularização", pct: parseFloat(com.regularizacaoPct) || 0, valor: (v * (parseFloat(com.regularizacaoPct) || 0)) / 100 });
  return { tipo: "papeis", partes };
}

function defaultPricingConfig() {
  const config = {};
  // Comércio é sempre mais complexo que serviços (mais notas, mais obrigações fiscais)
  const seed = {
    "Simples Nacional - Comércio": { Legal: 60, "Departamento Pessoal": [90, 35], Fiscal: [110, 12], Contábil: [140, 10], Atendimento: 50 },
    "Simples Nacional - Serviços": { Legal: 50, "Departamento Pessoal": [90, 35], Fiscal: [80, 10], Contábil: [110, 8], Atendimento: 50 },
    "Lucro Presumido - Comércio": { Legal: 90, "Departamento Pessoal": [110, 45], Fiscal: [220, 18], Contábil: [260, 15], Atendimento: 80 },
    "Lucro Presumido - Serviços": { Legal: 80, "Departamento Pessoal": [110, 45], Fiscal: [170, 14], Contábil: [210, 12], Atendimento: 80 },
  };
  PRICING_REGIMES.forEach((regime) => {
    const p = emptyRegimePricing();
    PRICING_AREAS.forEach((a) => {
      const v = seed[regime][a.key];
      if (Array.isArray(v)) {
        p.areas[a.key] = { base: String(v[0]), variavel: String(v[1]) };
      } else {
        p.areas[a.key] = { base: String(v), variavel: "" };
      }
    });
    config[regime] = p;
  });

  config.global = { margemLucro: "40", cargaTributaria: "10" };
  config.complexidade = { Baixa: "0", Média: "15", Alta: "30" };
  config.sistemaGestao = "60";
  config.modalidadeEntrega = { Digital: "0", Híbrida: "80", Presencial: "180" };
  config.produtos = defaultProductCatalog();

  return config;
}

function pricingKey(client) {
  if (client.regimeTributario === "Lucro Real") return "Lucro Real";
  if (client.regimeTributario === "MEI") return "MEI";
  return `${client.regimeTributario} - ${client.atividade || "Serviços"}`;
}

function calcSuggestedPrice(client, pricingConfig) {
  const key = pricingKey(client);
  const config = pricingConfig[key];
  if (!config) return null;

  const funcionarios = parseFloat(client.numFuncionarios) || 0;
  const blocosNotas = Math.ceil((parseFloat(client.numNotasFiscais) || 0) / 10);

  // 1. Custo operacional das 5 áreas
  let custoOperacional = 0;
  const areasDetalhe = [];
  PRICING_AREAS.forEach((a) => {
    const cell = config.areas[a.key] || { base: 0, variavel: 0 };
    const base = parseFloat(cell.base) || 0;
    const variavel = parseFloat(cell.variavel) || 0;
    let extra = 0;
    if (a.variable === "funcionario") extra = variavel * funcionarios;
    if (a.variable === "nota") extra = variavel * blocosNotas;
    custoOperacional += base + extra;
    areasDetalhe.push({ key: a.key, base, extra, subtotal: base + extra });
  });

  // 2. Ajuste por complexidade do cliente (%)
  const complexidadePct = parseFloat((pricingConfig.complexidade || {})[client.complexidade || "Média"]) || 0;
  const custoAjustado = custoOperacional * (1 + complexidadePct / 100);

  // 3. Adicionais fixos: sistema de gestão financeira + modalidade de entrega
  // Cliente COM sistema de gestão financeira facilita o trabalho do escritório (menos conciliação manual),
  // então o adicional entra quando o cliente NÃO tem sistema — é o inverso do que se imaginaria à primeira vista.
  const adicionalSistema = !client.usaSistemaGestao ? parseFloat(pricingConfig.sistemaGestao) || 0 : 0;
  const adicionalModalidade = parseFloat((pricingConfig.modalidadeEntrega || {})[client.modalidadeEntrega || "Digital"]) || 0;
  const custoComAdicionais = custoAjustado + adicionalSistema + adicionalModalidade;

  // 4. Margem de lucro do escritório + carga tributária embutidas no preço final
  const margem = parseFloat((pricingConfig.global || {}).margemLucro) || 0;
  const carga = parseFloat((pricingConfig.global || {}).cargaTributaria) || 0;
  const divisor = Math.max(0.05, 1 - (margem + carga) / 100);
  const precoFinal = custoComAdicionais / divisor;

  const markup = parseFloat(config.markupConsultiva) || 0;
  return {
    tradicional: precoFinal,
    consultiva: precoFinal * (1 + markup / 100),
    detalhe: {
      regime: key,
      funcionarios,
      notasFiscais: parseFloat(client.numNotasFiscais) || 0,
      complexidade: client.complexidade || "Média",
      complexidadePct,
      usaSistemaGestao: !!client.usaSistemaGestao,
      modalidadeEntrega: client.modalidadeEntrega || "Digital",
      areasDetalhe,
      custoOperacional,
      custoAjustado,
      adicionalSistema,
      adicionalModalidade,
      margem,
      carga,
      precoFinal,
    },
  };
}

function formatCNPJ(v) {
  const d = v.replace(/\D/g, "").slice(0, 14);
  return d
    .replace(/^(\d{2})(\d)/, "$1.$2")
    .replace(/^(\d{2})\.(\d{3})(\d)/, "$1.$2.$3")
    .replace(/\.(\d{3})(\d)/, ".$1/$2")
    .replace(/(\d{4})(\d)/, "$1-$2");
}

// Consulta pública gratuita da Receita Federal via BrasilAPI (sem necessidade de chave/login).
async function consultarCNPJ(cnpjFormatado) {
  const digits = cnpjFormatado.replace(/\D/g, "");
  if (digits.length !== 14) {
    throw new Error("CNPJ incompleto — digite os 14 números antes de consultar.");
  }
  const res = await fetch(`https://brasilapi.com.br/api/cnpj/v1/${digits}`);
  if (!res.ok) {
    if (res.status === 404) throw new Error("CNPJ não encontrado na base da Receita Federal.");
    throw new Error("Não foi possível consultar o CNPJ agora. Tente novamente em instantes.");
  }
  const data = await res.json();

  const enderecoPartes = [
    data.logradouro && `${data.logradouro}${data.numero ? ", " + data.numero : ""}`,
    data.complemento,
    data.bairro,
    data.municipio && data.uf ? `${data.municipio} - ${data.uf}` : data.municipio,
    data.cep,
  ].filter(Boolean);

  const cnaeDescricao = (data.cnae_fiscal_descricao || "").toLowerCase();
  const comercioKeywords = ["comércio", "comercio", "varejista", "varejo", "atacadista", "atacado"];
  const atividade = comercioKeywords.some((k) => cnaeDescricao.includes(k)) ? "Comércio" : "Serviços";

  const socioAdmin = (data.qsa || []).find((s) => (s.qualificacao_socio || "").toLowerCase().includes("administrador")) || (data.qsa || [])[0];

  return {
    razaoSocial: data.razao_social || "",
    nomeFantasia: data.nome_fantasia || "",
    endereco: enderecoPartes.join(", "),
    telefone: data.ddd_telefone_1 || "",
    email: data.email || "",
    atividade,
    regimeTributario: data.porte === "MEI" ? "MEI" : undefined,
    representanteLegal: socioAdmin ? socioAdmin.nome_socio : undefined,
    situacao: data.descricao_situacao_cadastral || "",
  };
}

function formatMoney(v) {
  const n = parseFloat(String(v).replace(/[^\d.,]/g, "").replace(",", "."));
  if (isNaN(n)) return "R$ 0,00";
  return n.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
}

function planValue(c) {
  return c.plano === "Contabilidade Consultiva" ? c.valorConsultiva : c.valorTradicional;

// Resolve o valor de uma venda: produtos com preço livre usam o valor digitado;
// produtos "auto" (como a Assessoria Contábil) usam o campo de preço vinculado no catálogo
// (planoCampo), com o valor do plano genérico do cliente como último recurso.
function resolveSaleValue(p, client) {
  if (!p.auto) return parseFloat(p.valor) || 0;
  if (p.planoCampo) return parseFloat(client[p.planoCampo]) || 0;
  return parseFloat(planValue(client)) || 0;
}

function produtosTotal(c) {
  return (c.produtosContratados || []).reduce((sum, p) => sum + resolveSaleValue(p, c), 0);
}

function contractedTotal(c) {
  return produtosTotal(c);
}

// Achata todos os produtos vendidos por clientes "ganho" em linhas individuais,
// para permitir filtrar o relatório por mês, produto ou vendedor.
function buildSalesRows(clients, pricingConfig) {
  const rows = [];
  clients
    .filter((c) => c.status === "ganho")
    .forEach((c) => {
      (c.produtosContratados || []).forEach((p) => {
        const produtoId = p.produtoId || p.id;
        const catalogProd = pricingConfig ? (pricingConfig.produtos || []).find((cp) => cp.id === produtoId) : null;
        if (!catalogProd) return;
        const valor = resolveSaleValue(p, c);
        const dataVenda = p.dataVenda || c.dataVenda || "";
        rows.push({
          clientId: c.id,
          cliente: c.razaoSocial || "Sem nome",
          produtoId,
          produtoNome: p.nome,
          catalogProd,
          valor,
          dataVenda,
          mesAno: dataVenda ? dataVenda.slice(0, 7) : "",
          vendedor: p.vendedor || c.vendedor || "",
          executor: p.executor || c.executor || "",
        });
      });
    });
  return rows;
}

function filterSalesRows(rows, { mes, produtoId, vendedor }) {
  return rows.filter((r) => {
    if (mes && r.mesAno !== mes) return false;
    if (produtoId && r.produtoId !== produtoId) return false;
    if (vendedor && r.vendedor !== vendedor) return false;
    return true;
  });
}

// Constrói o relatório de comissões a partir de linhas de venda já filtradas.
function buildCommissionReportFromRows(rows) {
  const porPessoa = {};
  const addTo = (nome, papel, valor) => {
    if (!nome) nome = "(sem responsável definido)";
    if (!porPessoa[nome]) porPessoa[nome] = { venda: 0, execucao: 0, total: 0 };
    porPessoa[nome][papel] = (porPessoa[nome][papel] || 0) + valor;
    porPessoa[nome].total += valor;
  };
  const linhas = [];

  rows.forEach((r) => {
    const com = calcComissao(r.catalogProd, r.valor);
    if (com.tipo === "primeiroHonorario") {
      addTo(r.vendedor, "venda", com.valor);
      linhas.push({ cliente: r.cliente, produto: r.produtoNome, pessoa: r.vendedor || "-", papel: "Venda (1º honorário)", valor: com.valor, data: r.dataVenda });
    } else if (com.tipo === "papeis") {
      com.partes.forEach((pt) => {
        const ehVenda = pt.papel === "Venda" || pt.papel.startsWith("Combinado");
        const nome = ehVenda ? r.vendedor : r.executor;
        addTo(nome, ehVenda ? "venda" : "execucao", pt.valor);
        linhas.push({ cliente: r.cliente, produto: r.produtoNome, pessoa: nome || "-", papel: pt.papel, valor: pt.valor, data: r.dataVenda });
      });
    }
  });

  return { porPessoa, linhas };
}

function buildFunnelReport(clients) {
  const ganhos = clients.filter((c) => c.status === "ganho");
  const perdidos = clients.filter((c) => c.status === "perdido");
  const abertos = clients.filter((c) => c.status === "aberto");
  const totalDecididos = ganhos.length + perdidos.length;
  const taxaConversao = totalDecididos > 0 ? (ganhos.length / totalDecididos) * 100 : 0;
  const mrr = ganhos.reduce((sum, c) => sum + contractedTotal(c), 0);
  const ticketMedio = ganhos.length > 0 ? mrr / ganhos.length : 0;

  const porEtapa = SALES_STAGES.map((stage) => ({
    stage,
    clientes: abertos.filter((c) => c.stage === stage),
  }));

  return { ganhos, perdidos, abertos, taxaConversao, mrr, ticketMedio, porEtapa };
}

// Reúne cada produto vendido (fora a Assessoria Contábil) como uma tarefa de execução própria.
function buildExecucaoTasks(clients) {
  const tasks = [];
  clients
    .filter((c) => c.status === "ganho")
    .forEach((c) => {
      (c.produtosContratados || []).forEach((p) => {
        if (p.auto) return; // Assessoria Contábil já tem seu próprio funil de integração
        tasks.push({
          clientId: c.id,
          client: c,
          saleId: p.id,
          produtoNome: p.nome,
          etapaExecucao: p.etapaExecucao || EXECUCAO_STAGES[0],
          dataVenda: p.dataVenda,
          vendedor: p.vendedor || c.vendedor,
          executor: p.executor || c.executor,
          valor: p.valor,
        });
      });
    });
  return tasks;
}

function buildOnboardingReport(clients, responsavelIntegracao) {
  const ganhos = clients.filter((c) => c.status === "ganho" && (!responsavelIntegracao || c.responsavelIntegracao === responsavelIntegracao));
  return ONBOARD_STAGES.map((stage) => ({
    stage,
    clientes: ganhos.filter((c) => c.onboardStage === stage),
  }));
}

function formatDateBR(iso) {
  if (!iso) return "-";
  const [y, m, d] = iso.split("-");
  if (!y || !m || !d) return iso;
  return `${d}/${m}/${y}`;
}

// Regra: se o início cai até o dia 15, a própria competência do mês de início já entra;
// depois disso, entra a partir do mês seguinte (tempo hábil para organizar documentos).
function suggestCompetencia(dataInicioISO) {
  if (!dataInicioISO) return "";
  const [y, m, d] = dataInicioISO.split("-").map(Number);
  if (!y || !m || !d) return "";
  let mesIdx = m - 1;
  let ano = y;
  if (d > 15) {
    mesIdx += 1;
    if (mesIdx > 11) {
      mesIdx = 0;
      ano += 1;
    }
  }
  return `${MESES_PT[mesIdx]}/${ano}`;
}

function CnpjGroupField({ cnpjsAdicionais, onChange }) {
  const [loadingId, setLoadingId] = useState(null);
  const [msgId, setMsgId] = useState(null);
  const [msg, setMsg] = useState("");

  const addEmpty = () => {
    onChange([...(cnpjsAdicionais || []), { id: "grp-" + Date.now(), cnpj: "", razaoSocial: "", nomeFantasia: "" }]);
  };

  const updateEntry = (id, field, value) => {
    onChange((cnpjsAdicionais || []).map((e) => (e.id === id ? { ...e, [field]: value } : e)));
  };

  const removeEntry = (id) => {
    onChange((cnpjsAdicionais || []).filter((e) => e.id !== id));
  };

  const consultar = async (entry) => {
    setMsgId(entry.id);
    setMsg("");
    setLoadingId(entry.id);
    try {
      const dados = await consultarCNPJ(entry.cnpj);
      updateEntry(entry.id, "razaoSocial", dados.razaoSocial || entry.razaoSocial);
      updateEntry(entry.id, "nomeFantasia", dados.nomeFantasia || entry.nomeFantasia);
      setMsg("✓ Encontrado na Receita Federal.");
    } catch (err) {
      setMsg(err.message || "Não foi possível consultar.");
    } finally {
      setLoadingId(null);
    }
  };

  return (
    <div style={{ marginBottom: 14 }}>
      <span
        style={{
          display: "block",
          fontSize: 12,
          letterSpacing: "0.04em",
          textTransform: "uppercase",
          color: "#8B8577",
          marginBottom: 5,
          fontFamily: "var(--mono)",
        }}
      >
        Outros CNPJs deste grupo (opcional)
      </span>
      <div style={{ fontSize: 11, color: "#A6A08F", marginBottom: 10 }}>
        Para negociações que fecham mais de uma empresa junto (mesmo grupo econômico) — todas ficam registradas nesta mesma negociação.
      </div>

      {(cnpjsAdicionais || []).length > 0 && (
        <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 10 }}>
          {cnpjsAdicionais.map((entry) => (
            <div key={entry.id} style={{ border: "1px solid #DAD3C3", borderRadius: 6, padding: "10px 12px", background: "#FFFFFF" }}>
              <div style={{ display: "flex", gap: 6, marginBottom: 6 }}>
                <input
                  style={{ ...inputStyle, fontFamily: "var(--mono)", flex: 1 }}
                  value={entry.cnpj}
                  onChange={(e) => updateEntry(entry.id, "cnpj", formatCNPJ(e.target.value))}
                  placeholder="00.000.000/0000-00"
                />
                <button
                  type="button"
                  disabled={loadingId === entry.id}
                  onClick={() => consultar(entry)}
                  style={{
                    padding: "0 10px",
                    background: loadingId === entry.id ? "#DAD3C3" : "#1E2A38",
                    color: "#FAF9F4",
                    border: "none",
                    borderRadius: 4,
                    fontSize: 11.5,
                    cursor: loadingId === entry.id ? "default" : "pointer",
                    whiteSpace: "nowrap",
                  }}
                >
                  {loadingId === entry.id ? "..." : "Consultar"}
                </button>
                <button
                  type="button"
                  onClick={() => removeEntry(entry.id)}
                  title="Remover"
                  style={{ padding: "0 9px", background: "none", border: "1px solid #DAD3C3", borderRadius: 4, color: "#A8483E", cursor: "pointer" }}
                >
                  <Icon path={ICONS.close} size={12} color="#A8483E" />
                </button>
              </div>
              <input
                style={{ ...inputStyle, fontSize: 12.5 }}
                value={entry.razaoSocial}
                onChange={(e) => updateEntry(entry.id, "razaoSocial", e.target.value)}
                placeholder="Razão social desta empresa"
              />
              {msgId === entry.id && msg && (
                <div style={{ fontSize: 10.5, color: msg.startsWith("✓") ? "#2F6F5E" : "#A8483E", marginTop: 4 }}>{msg}</div>
              )}
            </div>
          ))}
        </div>
      )}

      <button
        type="button"
        onClick={addEmpty}
        style={{
          display: "flex",
          alignItems: "center",
          gap: 6,
          padding: "7px 12px",
          background: "#F3F0E6",
          border: "1px dashed #B0AA98",
          borderRadius: 6,
          fontSize: 12,
          color: "#5A5548",
          cursor: "pointer",
        }}
      >
        <Icon path={ICONS.plus} size={12} color="#5A5548" />
        Adicionar CNPJ ao grupo
      </button>
    </div>
  );
}

function NotesLog({ notas, onChange }) {
  const [draft, setDraft] = useState("");

  const addNote = () => {
    if (!draft.trim()) return;
    const note = {
      id: "n-" + Date.now(),
      date: new Date().toLocaleDateString("pt-BR") + " " + new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }),
      text: draft.trim(),
    };
    onChange([note, ...(notas || [])]);
    setDraft("");
  };

  const removeNote = (id) => {
    onChange((notas || []).filter((n) => n.id !== id));
  };

  return (
    <div style={{ marginBottom: 14 }}>
      <span
        style={{
          display: "block",
          fontSize: 12,
          letterSpacing: "0.04em",
          textTransform: "uppercase",

          fontFamily: "var(--mono)",

      <div style={{ display: "flex", gap: 6, marginBottom: 10 }}>

          value={draft}

          style={{ ...inputStyle, minHeight: 54, resize: "vertical", flex: 1 }}

        <button
          type="button"
          onClick={addNote}
          style={{
            padding: "0 14px",
            background: "#2F6F5E",
            color: "#FAF9F4",
            border: "none",
            borderRadius: 4,
            fontSize: 13,
            cursor: "pointer",
          }}
        >
          Adicionar
        </button>
      </div>

      {(notas || []).length === 0 ? (
        <div style={{ fontSize: 12.5, color: "#8B8577", fontStyle: "italic" }}>Nenhuma nota registrada ainda.</div>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 8, maxHeight: 220, overflowY: "auto" }}>
          {(notas || []).map((n) => (

              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 3 }}>
                <span style={{ fontFamily: "var(--mono)", fontSize: 10.5, color: "#B8862F" }}>{n.date}</span>
                <button
                  type="button"
                  onClick={() => removeNote(n.id)}
                  style={{ background: "none", border: "none", color: "#A8483E", fontSize: 11, cursor: "pointer" }}
                >
                  remover
                </button>
              </div>
              <div style={{ fontSize: 12.5, color: "#3A362E", lineHeight: 1.5 }}>{n.text}</div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

          <Field label="Observação (opcional)">

        <div style={{ padding: "14px 24px", borderTop: "1px solid #E4DFD1", display: "flex", gap: 10 }}>

              flex: 1,
              padding: "10px 14px",
              background: canSubmit ? "#1E2A38" : "#DAD3C3",

        </div>
      </div>
    </div>
  );
}

function renderTelegramLine(line, key) {
  // Parser simples: *negrito*, _itálico_, `código` — mesma sintaxe do Markdown do Telegram.
  const parts = [];
  const regex = /(\*[^*]+\*|_[^_]+_|`[^`]+`)/g;
  let lastIndex = 0;
  let match;
  let i = 0;
  while ((match = regex.exec(line)) !== null) {
    if (match.index > lastIndex) parts.push(line.slice(lastIndex, match.index));
    const token = match[0];
    if (token.startsWith("*")) {
      parts.push(<strong key={key + "-" + i} style={{ fontWeight: 700 }}>{token.slice(1, -1)}</strong>);
    } else if (token.startsWith("_")) {
      parts.push(<em key={key + "-" + i}>{token.slice(1, -1)}</em>);
    } else {
      parts.push(
        <code key={key + "-" + i} style={{ fontFamily: "var(--mono)", background: "rgba(0,0,0,0.06)", padding: "1px 4px", borderRadius: 3, fontSize: "0.93em" }}>
          {token.slice(1, -1)}
        </code>
      );
    }
    lastIndex = match.index + token.length;
    i++;
  }
  if (lastIndex < line.length) parts.push(line.slice(lastIndex));
  return (
    <div key={key} style={{ minHeight: 4 }}>
      {parts.length ? parts : "\u00A0"}
    </div>
  );
}

          </div>
        </div>

        <div style={{ display: "flex", gap: 10 }}>
          <StatPill label="Em aberto" value={open.length} />

              display: "flex",

              border: "1px solid #DAD3C3",
              borderRadius: 8,
              fontSize: 13,
              fontWeight: 500,
              cursor: "pointer",
            }}
          >
            <Icon path={ICONS.download} size={14} />
            Importar venda
          </button>
          <button
            onClick={onNew}
            style={{
              display: "flex",
              alignItems: "center",
              gap: 6,
              padding: "0 18px",
              background: "#1E2A38",
              color: "#FAF9F4",
              border: "none",
              borderRadius: 8,
              fontSize: 13,
              fontWeight: 500,
              cursor: "pointer",
            }}
          >
            <Icon path={ICONS.plus} size={14} />
            Novo cliente
          </button>
        </div>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: `repeat(${SALES_STAGES.length}, 1fr)`, gap: 14, minWidth: 1050, overflowX: "auto" }}>
        {SALES_STAGES.map((stage, i) => {
          const items = clients.filter((c) => c.stage === stage && c.status === "aberto");
          const accent = STAGE_ACCENTS[i];
          const isOver = dragOverStage === stage;
          return (
            <div
              key={stage}
              onDragOver={(e) => {
                e.preventDefault();
                e.dataTransfer.dropEffect = "move";
                if (dragOverStage !== stage) setDragOverStage(stage);
              }}
              onDragLeave={() => setDragOverStage((prev) => (prev === stage ? null : prev))}
              onDrop={(e) => {
                e.preventDefault();
                const id = e.dataTransfer.getData("text/plain");
                if (id) onMoveStage(id, stage);
                setDragOverStage(null);
                setDraggingId(null);
              }}
              style={{
                background: isOver ? "#EAE4D3" : "#F3F0E6",
                borderRadius: 8,
                padding: "12px 10px",
                outline: isOver ? `2px dashed ${accent}` : "2px dashed transparent",

                  <div style={{ fontSize: 11.5, color: "#B0AA98", fontStyle: "italic", padding: "6px 2px" }}>

                      >
                        <div
                          onClick={() => onOpen(c)}
                          style={{ cursor: "pointer", fontFamily: "var(--serif)", fontSize: 14, color: "#1E2A38", marginBottom: 10, lineHeight: 1.25 }}
                        >
                          {c.razaoSocial}
                        </div>
                        {isDistratado ? (
                          <span
                            style={{
                              display: "inline-flex",
                              alignItems: "center",
                              gap: 5,
                              fontFamily: "var(--mono)",
                              fontSize: 10.5,
                              color: DISTRATADO_ACCENT,
                              background: "rgba(168,72,62,0.1)",
                              padding: "4px 9px",
                              borderRadius: 20,
                            }}
                          >
                            ✕ distratado
                          </span>
                        ) : isLast ? (
                          <span
                            style={{
                              display: "inline-flex",
                              alignItems: "center",
                              gap: 5,
                              fontFamily: "var(--mono)",
                              fontSize: 10.5,
                              color: "#B8862F",
                              background: "rgba(184,134,47,0.1)",
                              padding: "4px 9px",
                              borderRadius: 20,
                            }}
                          >
                            ✓ concluído
                          </span>
                        ) : (
                          <div style={{ display: "flex", gap: 6 }}>
                            <button
                              onClick={() => onAdvance(c)}
                              style={{
                                display: "flex",
                                alignItems: "center",
                                gap: 5,
                                fontSize: 11.5,
                                padding: "6px 10px",
                                background: "#2F6F5E",
                                color: "#FAF9F4",
                                border: "none",
                                borderRadius: 5,
                                cursor: "pointer",
                                fontWeight: 500,
                              }}
                            >
                              Avançar
                              <Icon path={ICONS.arrowRight} size={12} />
                            </button>
                            <button
                              onClick={() => onDistratar(c)}
                              title="Marcar como distratado"
                              style={{
                                display: "flex",
                                alignItems: "center",
                                justifyContent: "center",
                                padding: "6px 8px",
                                background: "transparent",
                                color: "#A8483E",
                                border: "1px solid #E4C9C5",
                                borderRadius: 5,
                                cursor: "pointer",
                              }}
                            >
                              <Icon path={ICONS.close} size={12} color="#A8483E" />
                            </button>
                          </div>
                        )}
                      </div>
                    ))
                  )}
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function PricingCell({ regime, area, value, onChange }) {
  return (
    <div style={{ background: "#FFFFFF", border: "1px solid #E4DFD1", borderRadius: 6, padding: "8px 9px" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 4, marginBottom: 6 }}>
        <span style={{ fontSize: 10, color: "#A6A08F" }}>R$</span>
        <input
          type="text"
          value={value.base}
          onChange={(e) => onChange({ ...value, base: e.target.value.replace(/[^\d.,]/g, "") })}
          placeholder="0"
          style={{
            width: "100%",
            border: "none",
            outline: "none",
            fontFamily: "var(--mono)",
            fontSize: 13,
            color: "#1E2A38",
            fontWeight: 600,
          }}
        />
      </div>
      {area.variable && (
        <div style={{ display: "flex", alignItems: "center", gap: 4, borderTop: "1px dashed #E4DFD1", paddingTop: 5 }}>
          <span style={{ fontSize: 9, color: "#B8862F" }}>+R$</span>
          <input
            type="text"
            value={value.variavel}
            onChange={(e) => onChange({ ...value, variavel: e.target.value.replace(/[^\d.,]/g, "") })}
            placeholder="0"
            style={{
              width: "100%",
              border: "none",
              outline: "none",
              fontFamily: "var(--mono)",
              fontSize: 11.5,
              color: "#8A6524",
            }}
          />
          <span style={{ fontSize: 9, color: "#B0AA98", whiteSpace: "nowrap" }}>{area.varLabel}</span>
        </div>
      )}
    </div>
  );
}

function GlobalParamField({ label, value, onChange, suffix }) {
  return (
    <div style={{ background: "#FFFFFF", border: "1px solid #E4DFD1", borderRadius: 8, padding: "10px 14px", flex: 1 }}>
      <div style={{ fontSize: 11, color: "#8B8577", marginBottom: 4 }}>{label}</div>
      <div style={{ display: "flex", alignItems: "baseline", gap: 4 }}>
        <input
          type="text"
          value={value}
          onChange={(e) => onChange(e.target.value.replace(/[^\d.,]/g, ""))}
          style={{ width: 56, border: "none", outline: "none", fontFamily: "var(--mono)", fontSize: 18, fontWeight: 700, color: "#1E2A38" }}
        />
        <span style={{ fontSize: 13, color: "#8B8577" }}>{suffix}</span>
      </div>
    </div>
  );
}

function PricingBoard({ pricingConfig, onChange }) {
  const updateCell = (regime, areaKey, value) => {
    onChange({
      ...pricingConfig,
      [regime]: {
        ...pricingConfig[regime],
        areas: { ...pricingConfig[regime].areas, [areaKey]: value },
      },
    });
  };

  const updateMarkup = (regime, v) => {
    onChange({ ...pricingConfig, [regime]: { ...pricingConfig[regime], markupConsultiva: v } });
  };

  const updateGlobal = (key, v) => {
    onChange({ ...pricingConfig, global: { ...pricingConfig.global, [key]: v } });
  };

  const updateComplexidade = (level, v) => {
    onChange({ ...pricingConfig, complexidade: { ...pricingConfig.complexidade, [level]: v } });
  };

  const updateModalidade = (mode, v) => {
    onChange({ ...pricingConfig, modalidadeEntrega: { ...pricingConfig.modalidadeEntrega, [mode]: v } });
  };

  const baseTotal = (regime) =>
    PRICING_AREAS.reduce((sum, a) => sum + (parseFloat(pricingConfig[regime].areas[a.key].base) || 0), 0);

  const precoReferencia = (regime) => {
    const [regimeTributario, atividade] = regime.includes("Simples Nacional")
      ? ["Simples Nacional", regime.split(" - ")[1]]
      : ["Lucro Presumido", regime.split(" - ")[1]];
    const refClient = { regimeTributario, atividade, numFuncionarios: "0", numNotasFiscais: "0", complexidade: "Média", usaSistemaGestao: false, modalidadeEntrega: "Digital" };
    const result = calcSuggestedPrice(refClient, pricingConfig);
    return result ? result.tradicional : 0;
  };

  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 8 }}>
        <div style={{ width: 40, height: 40, borderRadius: 8, background: "#B8862F", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
          <Icon path={ICONS.calculator} size={19} color="#FAF9F4" />
        </div>
        <div>
          <h1 style={{ fontFamily: "var(--serif)", fontSize: 24, margin: 0, color: "#1E2A38" }}>Estrutura de precificação</h1>
          <p style={{ fontSize: 13, color: "#8B8577", margin: "2px 0 0" }}>
            Custo do escritório por área, dividido pelos regimes tributários atendidos
          </p>
        </div>
      </div>

      <div style={{ display: "flex", gap: 10, margin: "18px 0" }}>
        <GlobalParamField label="Margem de lucro do escritório" value={pricingConfig.global.margemLucro} onChange={(v) => updateGlobal("margemLucro", v)} suffix="%" />
        <GlobalParamField label="Carga tributária embutida" value={pricingConfig.global.cargaTributaria} onChange={(v) => updateGlobal("cargaTributaria", v)} suffix="%" />
      </div>

      <div
        style={{
          background: "#F3F0E6",
          border: "1px solid #E4DFD1",
          borderRadius: 8,
          padding: "12px 16px",
          marginBottom: 18,
          fontSize: 12.5,
          color: "#5A5548",
          lineHeight: 1.6,
        }}
      >
        Preencha o custo base de cada área do escritório para cada regime, e o adicional variável onde fizer sentido
        (por funcionário no Departamento Pessoal, por cada 10 notas fiscais no Fiscal e Contábil). Comércio tende a
        custar mais que Serviços por ter mais obrigações fiscais. O <strong>preço final</strong> aplica a margem de
        lucro e a carga tributária acima sobre o custo já ajustado por complexidade e adicionais — fórmula:{" "}
        <span style={{ fontFamily: "var(--mono)" }}>custo ÷ (1 − (margem + carga))</span>. O valor da{" "}
        <strong>Consultiva</strong> soma um acréscimo percentual configurável por regime sobre esse preço final.
      </div>

      <div style={{ overflowX: "auto" }}>
        <div
          style={{
            display: "grid",
            gridTemplateColumns: `160px repeat(${PRICING_REGIMES.length}, 1fr)`,
            gap: 10,
            minWidth: 980,
          }}
        >
          <div />
          {PRICING_REGIMES.map((regime) => (
            <div key={regime} style={{ fontSize: 12, fontWeight: 600, color: "#1E2A38", textAlign: "center", padding: "0 4px" }}>
              {regime}
            </div>
          ))}

          {PRICING_AREAS.map((area) => (
            <Fragment key={area.key}>
              <div style={{ display: "flex", flexDirection: "column", justifyContent: "center", paddingTop: 4 }}>
                <div style={{ fontSize: 12.5, fontWeight: 600, color: "#3A362E" }}>{area.key}</div>
                <div style={{ fontSize: 10.5, color: "#A6A08F", marginTop: 2, lineHeight: 1.4 }}>{area.help}</div>
              </div>
              {PRICING_REGIMES.map((regime) => (
                <PricingCell
                  key={regime + area.key}
                  regime={regime}
                  area={area}
                  value={pricingConfig[regime].areas[area.key]}
                  onChange={(v) => updateCell(regime, area.key, v)}
                />
              ))}
            </Fragment>
          ))}

          <div style={{ display: "flex", alignItems: "center", fontSize: 12.5, fontWeight: 600, color: "#1E2A38", paddingTop: 10, borderTop: "1px solid #DAD3C3", marginTop: 4 }}>
            Custo operacional
          </div>
          {PRICING_REGIMES.map((regime) => (
            <div
              key={"total-" + regime}
              style={{
                paddingTop: 10,
                borderTop: "1px solid #DAD3C3",
                marginTop: 4,
                textAlign: "center",
                fontFamily: "var(--mono)",
                fontSize: 13,
                color: "#8B8577",
              }}
            >
              {formatMoney(baseTotal(regime))}
            </div>
          ))}

          <div style={{ display: "flex", flexDirection: "column", justifyContent: "center" }}>
            <div style={{ fontSize: 12.5, fontWeight: 600, color: "#1E2A38" }}>Preço final (Tradicional)</div>
            <div style={{ fontSize: 10.5, color: "#A6A08F", marginTop: 2 }}>c/ margem + carga tributária</div>
          </div>
          {PRICING_REGIMES.map((regime) => (
            <div
              key={"final-" + regime}
              style={{
                textAlign: "center",
                fontFamily: "var(--mono)",
                fontSize: 15,
                fontWeight: 700,
                color: "#2F6F5E",
              }}
            >
              {formatMoney(precoReferencia(regime))}
            </div>
          ))}

          <div style={{ display: "flex", flexDirection: "column", justifyContent: "center" }}>
            <div style={{ fontSize: 12.5, fontWeight: 600, color: "#3A362E" }}>Acréscimo Consultiva</div>
            <div style={{ fontSize: 10.5, color: "#A6A08F", marginTop: 2 }}>% sobre o preço final</div>
          </div>
          {PRICING_REGIMES.map((regime) => (
            <div key={"markup-" + regime} style={{ background: "#FFFFFF", border: "1px solid #E4DFD1", borderRadius: 6, padding: "8px 9px", display: "flex", alignItems: "center", justifyContent: "center", gap: 4 }}>
              <input
                type="text"
                value={pricingConfig[regime].markupConsultiva}
                onChange={(e) => updateMarkup(regime, e.target.value.replace(/[^\d.,]/g, ""))}
                style={{ width: 40, border: "none", outline: "none", fontFamily: "var(--mono)", fontSize: 13, color: "#B8862F", fontWeight: 700, textAlign: "right" }}
              />
              <span style={{ fontSize: 12, color: "#B8862F" }}>%</span>
            </div>
          ))}
        </div>
      </div>

      <div style={{ fontSize: 10.5, color: "#A6A08F", marginTop: 6, fontStyle: "italic" }}>
        "Preço final" de referência considera 0 funcionários, 0 notas fiscais, complexidade Média, sem sistema de
        gestão e modalidade Digital — o cadastro do cliente aplica os valores reais dele.
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16, marginTop: 26 }}>
        <div style={{ background: "#F3F0E6", border: "1px solid #E4DFD1", borderRadius: 8, padding: "16px 18px" }}>
          <div style={{ fontSize: 13, fontWeight: 600, color: "#1E2A38", marginBottom: 3 }}>Indicador de complexidade</div>
          <div style={{ fontSize: 11.5, color: "#8B8577", marginBottom: 12 }}>
            Ajuste percentual sobre o custo operacional, conforme o quanto o cliente exige do escritório
          </div>
          {COMPLEXITY_LEVELS.map((level) => (
            <div key={level} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8 }}>
              <span style={{ fontSize: 12.5, color: "#3A362E" }}>{level}</span>
              <div style={{ display: "flex", alignItems: "center", gap: 4, background: "#FFFFFF", border: "1px solid #E4DFD1", borderRadius: 6, padding: "5px 9px" }}>
                <span style={{ fontSize: 11, color: "#8B8577" }}>+</span>
                <input
                  type="text"
                  value={pricingConfig.complexidade[level]}
                  onChange={(e) => updateComplexidade(level, e.target.value.replace(/[^\d.,]/g, ""))}
                  style={{ width: 34, border: "none", outline: "none", fontFamily: "var(--mono)", fontSize: 12.5, color: "#1E2A38", textAlign: "right" }}
                />
                <span style={{ fontSize: 11, color: "#8B8577" }}>%</span>
              </div>
            </div>
          ))}
        </div>

        <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
          <div style={{ background: "#F3F0E6", border: "1px solid #E4DFD1", borderRadius: 8, padding: "16px 18px" }}>
            <div style={{ fontSize: 13, fontWeight: 600, color: "#1E2A38", marginBottom: 3 }}>Sistema de gestão financeira</div>
            <div style={{ fontSize: 11.5, color: "#8B8577", marginBottom: 10 }}>
              Cliente com sistema próprio facilita a conciliação — o adicional entra quando o cliente <strong>NÃO</strong> tem sistema de gestão financeira (mais trabalho manual pro escritório)
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 4, background: "#FFFFFF", border: "1px solid #E4DFD1", borderRadius: 6, padding: "7px 10px", width: "fit-content" }}>
              <span style={{ fontSize: 11, color: "#8B8577" }}>R$ +</span>
              <input
                type="text"
                value={pricingConfig.sistemaGestao}
                onChange={(e) => onChange({ ...pricingConfig, sistemaGestao: e.target.value.replace(/[^\d.,]/g, "") })}
                style={{ width: 60, border: "none", outline: "none", fontFamily: "var(--mono)", fontSize: 13, color: "#1E2A38", fontWeight: 600 }}
              />
              <span style={{ fontSize: 11, color: "#8B8577" }}>/mês</span>
            </div>
          </div>

          <div style={{ background: "#F3F0E6", border: "1px solid #E4DFD1", borderRadius: 8, padding: "16px 18px" }}>
            <div style={{ fontSize: 13, fontWeight: 600, color: "#1E2A38", marginBottom: 3 }}>Modalidade de entrega</div>
            <div style={{ fontSize: 11.5, color: "#8B8577", marginBottom: 12 }}>
              Adicional fixo conforme o quanto de atendimento presencial o cliente exige
            </div>
            {DELIVERY_MODES.map((mode) => (
              <div key={mode} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8 }}>
                <span style={{ fontSize: 12.5, color: "#3A362E" }}>{mode}</span>
                <div style={{ display: "flex", alignItems: "center", gap: 4, background: "#FFFFFF", border: "1px solid #E4DFD1", borderRadius: 6, padding: "5px 9px" }}>
                  <span style={{ fontSize: 11, color: "#8B8577" }}>R$ +</span>
                  <input
                    type="text"
                    value={pricingConfig.modalidadeEntrega[mode]}
                    onChange={(e) => updateModalidade(mode, e.target.value.replace(/[^\d.,]/g, ""))}
                    style={{ width: 44, border: "none", outline: "none", fontFamily: "var(--mono)", fontSize: 12.5, color: "#1E2A38", textAlign: "right" }}
                  />
                </div>
              </div>
            ))}
          </div>
        </div>
      </div>

      <div
        style={{
          background: "#16233A",
          borderRadius: 8,
          padding: "14px 18px",
          marginTop: 20,
          fontSize: 12.5,
          color: "#D9D6C9",
        }}
      >
        <strong style={{ color: "#F5F4EF" }}>Lucro Real</strong> não entra nesta tabela — como o volume de apurações e
        obrigações varia muito caso a caso, o preço para esse regime deve ser orçado individualmente. No cadastro do
        cliente, os campos de valor continuam liberados para preenchimento manual quando o regime for Lucro Real ou MEI.
      </div>

      <div style={{ marginTop: 30 }}>
        <div style={{ fontSize: 16, fontFamily: "var(--serif)", color: "#1E2A38", marginBottom: 3 }}>Catálogo de produtos</div>
        <div style={{ fontSize: 12, color: "#8B8577", marginBottom: 14 }}>
          A Assessoria Contábil é o produto principal — seu valor é calculado pela estrutura acima. Os demais produtos
          têm valor livre e podem ser combinados no cadastro do cliente, selecionando quantos forem contratados.
        </div>

        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {(pricingConfig.produtos || []).map((prod) => (
            <div
              key={prod.id}
              style={{
                display: "flex",
                alignItems: "center",
                gap: 10,
                background: "#FFFFFF",
                border: "1px solid #E4DFD1",
                borderRadius: 6,
                padding: "9px 12px",
              }}
            >
              <input
                type="text"
                value={prod.nome}
                onChange={(e) => {
                  const produtos = pricingConfig.produtos.map((p) => (p.id === prod.id ? { ...p, nome: e.target.value } : p));
                  onChange({ ...pricingConfig, produtos });
                }}
                disabled={prod.auto}
                style={{ flex: 1, border: "none", outline: "none", fontSize: 13, color: prod.auto ? "#8B8577" : "#1E2A38", background: "transparent" }}
              />
              {prod.auto ? (
                <span style={{ fontSize: 11, color: "#B8862F", fontStyle: "italic" }}>preço automático (plano)</span>
              ) : (
                <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
                  <span style={{ fontSize: 11, color: "#8B8577" }}>R$</span>
                  <input
                    type="text"
                    value={prod.valor}
                    onChange={(e) => {
                      const v = e.target.value.replace(/[^\d.,]/g, "");
                      const produtos = pricingConfig.produtos.map((p) => (p.id === prod.id ? { ...p, valor: v } : p));
                      onChange({ ...pricingConfig, produtos });
                    }}
                    placeholder="a combinar"
                    style={{ width: 78, border: "1px solid #DAD3C3", borderRadius: 4, padding: "4px 6px", fontFamily: "var(--mono)", fontSize: 12.5 }}
                  />
                </div>
              )}
              {!prod.auto && (
                <button
                  type="button"
                  onClick={() => onChange({ ...pricingConfig, produtos: pricingConfig.produtos.filter((p) => p.id !== prod.id) })}
                  style={{ background: "none", border: "none", color: "#A8483E", cursor: "pointer", fontSize: 12 }}
                >
                  remover
                </button>
              )}
            </div>
          ))}
        </div>

        <button
          type="button"
          onClick={() =>
            onChange({
              ...pricingConfig,
              produtos: [...pricingConfig.produtos, { id: "produto-" + Date.now(), nome: "Novo produto", valor: "", comissao: { vendaPct: "10" } }],
            })
          }
          style={{
            display: "flex",
            alignItems: "center",
            gap: 6,
            marginTop: 10,
            padding: "8px 14px",
            background: "#F3F0E6",
            border: "1px dashed #B8862F",
            borderRadius: 6,
            fontSize: 12.5,
            color: "#8A6524",
            cursor: "pointer",
          }}
        >
          <Icon path={ICONS.plus} size={13} color="#B8862F" />
          Adicionar produto
        </button>
      </div>

      <div style={{ marginTop: 30 }}>
        <div style={{ fontSize: 16, fontFamily: "var(--serif)", color: "#1E2A38", marginBottom: 3 }}>Política de comissionamento</div>
        <div style={{ fontSize: 12, color: "#8B8577", marginBottom: 14 }}>
          O campo <strong>Legal (fixo)</strong> é o valor pago em reais ao departamento que executa o serviço —
          não depende do valor de venda. Os campos em percentual (Venda, Execução, Regularização, Combinado) são
          calculados sobre o valor de venda cobrado do cliente. "Combinado" vale quando a mesma pessoa faz a venda e a
          execução; quando os papéis são de pessoas diferentes, use Venda + Execução (e Regularização, quando houver)
          separadamente. Assessoria Contábil é um caso à parte: comissão única sobre o primeiro honorário mensal.
        </div>

        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {(pricingConfig.produtos || []).map((prod) => {
            const com = prod.comissao || {};
            const updateCom = (field, v) => {
              const produtos = pricingConfig.produtos.map((p) =>
                p.id === prod.id ? { ...p, comissao: { ...p.comissao, [field]: v.replace(/[^\d.,]/g, "") } } : p
              );
              onChange({ ...pricingConfig, produtos });
            };
            return (
              <div
                key={prod.id}
                style={{
                  background: "#F3F0E6",
                  border: "1px solid #E4DFD1",
                  borderRadius: 6,
                  padding: "10px 12px",
                }}
              >
                <div style={{ fontSize: 12.5, fontWeight: 600, color: "#3A362E", marginBottom: 8 }}>{prod.nome}</div>
                {"primeiroHonorarioPct" in com ? (
                  <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                    <span style={{ fontSize: 11.5, color: "#5A5548" }}>1º honorário</span>
                    <input
                      type="text"
                      value={com.primeiroHonorarioPct}
                      onChange={(e) => updateCom("primeiroHonorarioPct", e.target.value)}
                      style={{ width: 40, border: "1px solid #DAD3C3", borderRadius: 4, padding: "3px 6px", fontFamily: "var(--mono)", fontSize: 12, textAlign: "right" }}
                    />
                    <span style={{ fontSize: 11.5, color: "#5A5548" }}>%</span>
                  </div>
                ) : (
                  <div style={{ display: "flex", flexWrap: "wrap", gap: 14 }}>
                    {"legalFixo" in com && (
                      <div style={{ display: "flex", alignItems: "center", gap: 5 }}>
                        <span style={{ fontSize: 11.5, color: "#5A5548" }}>Legal (fixo p/ execução)</span>
                        <span style={{ fontSize: 11, color: "#8B8577" }}>R$</span>
                        <input
                          type="text"
                          value={com.legalFixo}
                          onChange={(e) => updateCom("legalFixo", e.target.value)}
                          style={{ width: 44, border: "1px solid #DAD3C3", borderRadius: 4, padding: "3px 6px", fontFamily: "var(--mono)", fontSize: 12, textAlign: "right" }}
                        />
                      </div>
                    )}
                    {[
                      ["combinadoPct", "Combinado"],
                      ["vendaPct", "Venda"],
                      ["execucaoPct", "Execução"],
                      ["regularizacaoPct", "Regularização"],
                    ]
                      .filter(([field]) => field in com)
                      .map(([field, label]) => (
                        <div key={field} style={{ display: "flex", alignItems: "center", gap: 5 }}>
                          <span style={{ fontSize: 11.5, color: "#5A5548" }}>{label}</span>
                          <input
                            type="text"
                            value={com[field]}
                            onChange={(e) => updateCom(field, e.target.value)}
                            style={{ width: 36, border: "1px solid #DAD3C3", borderRadius: 4, padding: "3px 6px", fontFamily: "var(--mono)", fontSize: 12, textAlign: "right" }}
                          />
                          <span style={{ fontSize: 11.5, color: "#5A5548" }}>%</span>
                        </div>
                      ))}
                    {["legalFixo", "combinadoPct", "vendaPct", "execucaoPct", "regularizacaoPct"].filter((f) => !(f in com)).length > 0 && (
                      <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                        {["legalFixo", "combinadoPct", "vendaPct", "execucaoPct", "regularizacaoPct"]
                          .filter((f) => !(f in com))
                          .map((field) => (
                            <button
                              key={field}
                              type="button"
                              onClick={() => updateCom(field, field === "legalFixo" ? "75" : "10")}
                              style={{ fontSize: 10.5, padding: "3px 7px", background: "#FFFFFF", border: "1px dashed #B0AA98", borderRadius: 20, color: "#8B8577", cursor: "pointer" }}
                            >
                              + {{ legalFixo: "Legal (fixo)", combinadoPct: "Combinado", vendaPct: "Venda", execucaoPct: "Execução", regularizacaoPct: "Regularização" }[field]}
                            </button>
                          ))}
                      </div>
                    )}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function ExecucaoBoard({ clients, onOpen, onMoveStage }) {
  const [draggingId, setDraggingId] = useState(null);
  const [dragOverStage, setDragOverStage] = useState(null);

  const tasks = buildExecucaoTasks(clients);
  const emAndamento = tasks.filter((t) => t.etapaExecucao !== "Concluído").length;
  const concluidas = tasks.filter((t) => t.etapaExecucao === "Concluído").length;

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-end", marginBottom: 22, flexWrap: "wrap", gap: 16 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
          <div style={{ width: 40, height: 40, borderRadius: 8, background: "#C9A15A", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
            <Icon path={ICONS.contract} size={19} color="#FAF9F4" />
          </div>
          <div>
            <h1 style={{ fontFamily: "var(--serif)", fontSize: 24, margin: 0, color: "#1E2A38" }}>Execução de serviços</h1>
            <p style={{ fontSize: 13, color: "#8B8577", margin: "2px 0 0" }}>Acompanhamento de produtos avulsos vendidos (fora a Assessoria Contábil)</p>
          </div>
        </div>
        <div style={{ display: "flex", gap: 10 }}>
          <StatPill label="Em andamento" value={emAndamento} />
          <StatPill label="Concluídas" value={concluidas} />
        </div>
      </div>

      {tasks.length === 0 ? (
        <div style={{ border: "1px dashed #DAD3C3", borderRadius: 8, padding: "48px 20px", textAlign: "center", color: "#8B8577", fontSize: 13, background: "#F3F0E6" }}>
          Nenhum produto avulso vendido ainda. Produtos como Abertura de Empresa, Alteração Contratual, etc. aparecem aqui assim que forem vendidos a um cliente ganho.
        </div>
      ) : (
        <div style={{ display: "grid", gridTemplateColumns: `repeat(${EXECUCAO_STAGES.length}, 1fr)`, gap: 14, minWidth: 900, overflowX: "auto" }}>
          {EXECUCAO_STAGES.map((stage, i) => {
            const items = tasks.filter((t) => t.etapaExecucao === stage);
            const accent = EXECUCAO_ACCENTS[i];
            const isOver = dragOverStage === stage;
            return (
              <div
                key={stage}
                onDragOver={(e) => {
                  e.preventDefault();
                  e.dataTransfer.dropEffect = "move";
                  if (dragOverStage !== stage) setDragOverStage(stage);
                }}
                onDragLeave={() => setDragOverStage((prev) => (prev === stage ? null : prev))}
                onDrop={(e) => {
                  e.preventDefault();
                  const data = e.dataTransfer.getData("text/plain");
                  const [clientId, saleId] = data.split("::");
                  if (clientId && saleId) onMoveStage(clientId, saleId, stage);
                  setDragOverStage(null);
                  setDraggingId(null);
                }}
                style={{
                  background: isOver ? "#F5EFE0" : "#F3F0E6",
                  borderRadius: 8,
                  padding: "12px 10px",
                  outline: isOver ? `2px dashed ${accent}` : "2px dashed transparent",
                  outlineOffset: -2,
                }}
              >
                <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 12, paddingBottom: 10, borderBottom: `2px solid ${accent}` }}>
                  <span style={{ width: 6, height: 6, borderRadius: "50%", background: accent, flexShrink: 0 }} />
                  <span style={{ fontSize: 12, color: "#3A362E", fontWeight: 600 }}>{stage}</span>
                  <span
                    style={{
                      fontFamily: "var(--mono)",
                      fontSize: 10.5,
                      color: "#8B8577",
                      marginLeft: "auto",
                      background: "#FFFFFF",
                      borderRadius: 10,
                      padding: "1px 7px",
                      border: "1px solid #E4DFD1",
                    }}
                  >
                    {items.length}
                  </span>
                </div>
                <div>
                  {items.length === 0 ? (
                    <div style={{ fontSize: 11.5, color: "#B0AA98", fontStyle: "italic", padding: "6px 2px" }}>
                      {isOver ? "Solte aqui" : "Vazio"}
                    </div>
                  ) : (
                    items.map((t) => (
                      <div
                        key={t.clientId + t.saleId}
                        draggable
                        onDragStart={(e) => {
                          e.dataTransfer.effectAllowed = "move";
                          e.dataTransfer.setData("text/plain", `${t.clientId}::${t.saleId}`);
                          setDraggingId(t.clientId + t.saleId);
                        }}
                        onDragEnd={() => {
                          setDraggingId(null);
                          setDragOverStage(null);
                        }}
                        style={{
                          background: "#FFFFFF",
                          border: "1px solid #E4DFD1",
                          borderLeft: `3px solid ${accent}`,
                          borderRadius: 6,
                          padding: "12px 13px",
                          marginBottom: 10,
                          cursor: "grab",
                          opacity: draggingId === t.clientId + t.saleId ? 0.4 : 1,
                        }}
                      >
                        <div style={{ fontFamily: "var(--mono)", fontSize: 10, color: "#B8862F", marginBottom: 4 }}>{t.produtoNome}</div>
                        <div onClick={() => onOpen(t.client)} style={{ cursor: "pointer", fontFamily: "var(--serif)", fontSize: 13.5, color: "#1E2A38", marginBottom: 6 }}>
                          {t.client.razaoSocial}
                        </div>
                        <div style={{ fontSize: 10.5, color: "#8B8577" }}>
                          {formatMoney(t.valor)}{t.executor ? ` · ${t.executor}` : ""}
                        </div>
                      </div>
                    ))
                  )}
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function HistoryBoard({ clients, onOpen }) {
  const [search, setSearch] = useState("");
  const [statusFilter, setStatusFilter] = useState("todos"); // todos | ganho | perdido

  const historico = clients
    .filter((c) => c.status === "ganho" || c.status === "perdido")
    .filter((c) => statusFilter === "todos" || c.status === statusFilter)
    .filter((c) => {
      if (!search.trim()) return true;
      const q = search.trim().toLowerCase();
      return (c.razaoSocial || "").toLowerCase().includes(q) || (c.cnpj || "").includes(q);
    })
    .sort((a, b) => {
      const da = a.dataVenda || a.createdAt || "";
      const db = b.dataVenda || b.createdAt || "";
      return db.localeCompare(da);
    });

  const totalGanho = clients.filter((c) => c.status === "ganho").length;
  const totalPerdido = clients.filter((c) => c.status === "perdido").length;
  const totalDecididos = totalGanho + totalPerdido;
  const taxaConversao = totalDecididos > 0 ? ((totalGanho / totalDecididos) * 100).toFixed(1) : "0.0";

  return (
    <div>

function ReportsBoard({ clients, pricingConfig, onOpenPrint, filters, onFiltersChange }) {
  const funnel = buildFunnelReport(clients);
  const onboarding = buildOnboardingReport(clients, filters.responsavelIntegracao);

  const allRows = buildSalesRows(clients, pricingConfig);
  const filteredRows = filterSalesRows(allRows, filters);
  const commission = buildCommissionReportFromRows(filteredRows);
  const pessoas = Object.entries(commission.porPessoa).sort((a, b) => b[1].total - a[1].total);

  const filtroAtivo = !!(filters.mes || filters.produtoId || filters.vendedor || filters.responsavelIntegracao);
  const faturamentoFiltrado = filteredRows.reduce((sum, r) => sum + r.valor, 0);
  const clientesNoFiltro = new Set(filteredRows.map((r) => r.clientId)).size;
  const ticketFiltrado = clientesNoFiltro > 0 ? faturamentoFiltrado / clientesNoFiltro : 0;

  const mesesDisponiveis = [...new Set(allRows.map((r) => r.mesAno).filter(Boolean))].sort().reverse();
  const vendedoresDisponiveis = [...new Set(allRows.map((r) => r.vendedor).filter(Boolean))].sort();
  const integracaoDisponiveis = [...new Set(clients.map((c) => c.responsavelIntegracao).filter(Boolean))].sort();

  const mesLabel = (m) => {
    const [y, mm] = m.split("-");
    return `${MESES_PT[parseInt(mm, 10) - 1]}/${y}`;
  };

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-end", marginBottom: 22, flexWrap: "wrap", gap: 16 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
          <div style={{ width: 40, height: 40, borderRadius: 8, background: "#5A6B7A", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
            <Icon path={ICONS.doc} size={19} color="#FAF9F4" />
          </div>
          <div>
            <h1 style={{ fontFamily: "var(--serif)", fontSize: 24, margin: 0, color: "#1E2A38" }}>Relatórios</h1>
            <p style={{ fontSize: 13, color: "#8B8577", margin: "2px 0 0" }}>Visão consolidada de vendas, integração e comissões</p>
          </div>
        </div>
        <button
          onClick={onOpenPrint}
          style={{ display: "flex", alignItems: "center", gap: 7, padding: "10px 16px", background: "#1E2A38", color: "#FAF9F4", border: "none", borderRadius: 8, fontSize: 13, cursor: "pointer" }}
        >
          <Icon path={ICONS.download} size={14} />
          Exportar relatório em PDF
        </button>
      </div>

      <div style={{ display: "flex", gap: 10, marginBottom: 20, flexWrap: "wrap", alignItems: "center" }}>
        <select
          value={filters.mes}
          onChange={(e) => onFiltersChange({ ...filters, mes: e.target.value })}
          style={{ ...inputStyle, width: "auto", minWidth: 150 }}
        >
          <option value="">Todos os meses</option>
          {mesesDisponiveis.map((m) => (
            <option key={m} value={m}>{mesLabel(m)}</option>
          ))}
        </select>
        <select
          value={filters.produtoId}
          onChange={(e) => onFiltersChange({ ...filters, produtoId: e.target.value })}
          style={{ ...inputStyle, width: "auto", minWidth: 170 }}
        >
          <option value="">Todos os produtos</option>
          {(pricingConfig.produtos || []).map((p) => (
            <option key={p.id} value={p.id}>{p.nome}</option>
          ))}
        </select>
        <select
          value={filters.vendedor}
          onChange={(e) => onFiltersChange({ ...filters, vendedor: e.target.value })}
          style={{ ...inputStyle, width: "auto", minWidth: 150 }}
        >
          <option value="">Todos os vendedores</option>
          {vendedoresDisponiveis.map((v) => (
            <option key={v} value={v}>{v}</option>
          ))}
        </select>
        <select
          value={filters.responsavelIntegracao}
          onChange={(e) => onFiltersChange({ ...filters, responsavelIntegracao: e.target.value })}
          style={{ ...inputStyle, width: "auto", minWidth: 180 }}
        >
          <option value="">Toda a integração</option>
          {integracaoDisponiveis.map((v) => (
            <option key={v} value={v}>{v}</option>
          ))}
        </select>
        {filtroAtivo && (
          <button
            onClick={() => onFiltersChange({ mes: "", produtoId: "", vendedor: "", responsavelIntegracao: "" })}
            style={{ display: "flex", alignItems: "center", gap: 5, padding: "9px 12px", background: "none", border: "1px solid #DAD3C3", borderRadius: 6, fontSize: 12, color: "#5A5548", cursor: "pointer" }}
          >
            <Icon path={ICONS.close} size={11} color="#5A5548" />
            Limpar filtros
          </button>
        )}
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 12, marginBottom: 26 }}>
        <ReportMetric label={filtroAtivo ? "Faturamento (filtrado)" : "MRR (ganhos)"} value={formatMoney(filtroAtivo ? faturamentoFiltrado : funnel.mrr)} accent="#2F6F5E" />
        <ReportMetric label="Clientes ativos" value={filtroAtivo ? clientesNoFiltro : funnel.ganhos.length} />
        <ReportMetric label="Ticket médio" value={formatMoney(filtroAtivo ? ticketFiltrado : funnel.ticketMedio)} />
        <ReportMetric label="Taxa de conversão" value={funnel.taxaConversao.toFixed(1) + "%"} accent="#B8862F" />
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16, marginBottom: 26 }}>
        <div style={{ background: "#FFFFFF", border: "1px solid #E4DFD1", borderRadius: 8, padding: "16px 18px" }}>
          <div style={{ fontSize: 13, fontWeight: 600, color: "#1E2A38", marginBottom: 12 }}>Funil de vendas por etapa</div>
          {funnel.porEtapa.map((e, i) => (
            <div key={e.stage} style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 8 }}>
              <span style={{ width: 6, height: 6, borderRadius: "50%", background: STAGE_ACCENTS[i], flexShrink: 0 }} />
              <span style={{ fontSize: 12.5, color: "#3A362E", flex: 1 }}>{e.stage}</span>
              <span style={{ fontFamily: "var(--mono)", fontSize: 12.5, color: "#5A5548" }}>{e.clientes.length}</span>
            </div>
          ))}
        </div>

        <div style={{ background: "#FFFFFF", border: "1px solid #E4DFD1", borderRadius: 8, padding: "16px 18px" }}>
          <div style={{ fontSize: 13, fontWeight: 600, color: "#1E2A38", marginBottom: 12 }}>Integração por etapa</div>
          {onboarding.map((e, i) => (
            <div key={e.stage} style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 8 }}>
              <span style={{ width: 6, height: 6, borderRadius: "50%", background: ONBOARD_ACCENTS[i], flexShrink: 0 }} />
              <span style={{ fontSize: 12.5, color: "#3A362E", flex: 1 }}>{e.stage}</span>
              <span style={{ fontFamily: "var(--mono)", fontSize: 12.5, color: "#5A5548" }}>{e.clientes.length}</span>
            </div>
          ))}
        </div>
      </div>

      <div style={{ background: "#FFFFFF", border: "1px solid #E4DFD1", borderRadius: 8, padding: "16px 18px" }}>
        <div style={{ fontSize: 13, fontWeight: 600, color: "#1E2A38", marginBottom: 3 }}>Comissões por pessoa</div>
        <div style={{ fontSize: 11.5, color: "#8B8577", marginBottom: 14 }}>
          Soma da comissão de venda e execução{filtroAtivo ? " — respeitando os filtros acima" : " de todos os produtos contratados por clientes ganhos"}.
        </div>
        {pessoas.length === 0 ? (
          <div style={{ fontSize: 12.5, color: "#B0AA98", fontStyle: "italic" }}>Nenhuma comissão calculada com esses filtros.</div>
        ) : (
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {pessoas.map(([nome, v]) => (
              <div key={nome} style={{ display: "flex", alignItems: "center", gap: 10, padding: "8px 10px", background: "#F3F0E6", borderRadius: 6 }}>
                <span style={{ fontSize: 12.5, color: "#1E2A38", flex: 1 }}>{nome}</span>
                <span style={{ fontSize: 11, color: "#8B8577" }}>Venda {formatMoney(v.venda)}</span>
                <span style={{ fontSize: 11, color: "#8B8577" }}>Execução {formatMoney(v.execucao)}</span>
                <span style={{ fontFamily: "var(--mono)", fontSize: 13, fontWeight: 700, color: "#2F6F5E" }}>{formatMoney(v.total)}</span>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

function EquipeBoard() {
  const [users, setUsers] = useState([]);
  const [loading, setLoading] = useState(true);
  const [form, setForm] = useState({ name: "", email: "", password: "", role: "comercial" });
  const [error, setError] = useState("");
  const [creating, setCreating] = useState(false);

  const loadUsers = () => {
    setLoading(true);
    fetch("/api/users")
      .then((r) => r.json())
      .then((data) => setUsers(data.users || []))
      .finally(() => setLoading(false));
  };

  useEffect(() => {
    loadUsers();
  }, []);

  const handleCreate = async () => {
    setError("");
    if (!form.name || !form.email || form.password.length < 6) {
      setError("Preencha nome, e-mail e uma senha com pelo menos 6 caracteres.");
      return;
    }
    setCreating(true);
    try {
      const res = await fetch("/api/users", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(form),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Não foi possível criar o usuário.");
      setForm({ name: "", email: "", password: "", role: "comercial" });
      loadUsers();
    } catch (err) {
      setError(err.message);
    } finally {
      setCreating(false);
    }
  };

  const handleDelete = async (id) => {
    if (!confirm("Remover este usuário? Ele perde acesso imediatamente.")) return;
    await fetch(`/api/users/${id}`, { method: "DELETE" });
    loadUsers();
  };

  const ROLE_LABELS = {
    admin: "Administrador — acesso total, inclusive precificação e equipe",
    comercial: "Comercial — funil de vendas, integração e relatórios",
    operacional: "Operacional — só o funil de integração, sem dados comerciais",
  };

  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 22 }}>
        <div style={{ width: 40, height: 40, borderRadius: 8, background: "#2F6F5E", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
          <Icon path={ICONS.check} size={19} color="#FAF9F4" />
        </div>
        <div>
          <h1 style={{ fontFamily: "var(--serif)", fontSize: 24, margin: 0, color: "#1E2A38" }}>Equipe</h1>
          <p style={{ fontSize: 13, color: "#8B8577", margin: "2px 0 0" }}>Quem tem acesso ao CRM e o que cada papel pode fazer</p>
        </div>
      </div>

      <div style={{ background: "#FFFFFF", border: "1px solid #E4DFD1", borderRadius: 8, padding: "18px 20px", marginBottom: 24 }}>
        <div style={{ fontSize: 13, fontWeight: 600, color: "#1E2A38", marginBottom: 14 }}>Adicionar pessoa</div>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 10 }}>
          <input style={inputStyle} placeholder="Nome" value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} />
          <input style={inputStyle} placeholder="E-mail" value={form.email} onChange={(e) => setForm({ ...form, email: e.target.value })} />
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 10 }}>
          <input style={inputStyle} type="password" placeholder="Senha (6+ caracteres)" value={form.password} onChange={(e) => setForm({ ...form, password: e.target.value })} />
          <select style={inputStyle} value={form.role} onChange={(e) => setForm({ ...form, role: e.target.value })}>
            <option value="admin">Administrador</option>
            <option value="comercial">Comercial</option>
            <option value="operacional">Operacional</option>
          </select>
        </div>
        {error && <div style={{ fontSize: 12, color: "#A8483E", marginBottom: 10 }}>{error}</div>}
        <button
          onClick={handleCreate}
          disabled={creating}
          style={{ padding: "9px 16px", background: "#1E2A38", color: "#FAF9F4", border: "none", borderRadius: 6, fontSize: 13, cursor: "pointer" }}
        >
          {creating ? "Criando..." : "Criar acesso"}
        </button>
      </div>

      <div style={{ background: "#F3F0E6", border: "1px solid #E4DFD1", borderRadius: 8, padding: "12px 16px", marginBottom: 20, fontSize: 11.5, color: "#5A5548", lineHeight: 1.6 }}>
        {Object.entries(ROLE_LABELS).map(([role, desc]) => (
          <div key={role}>
            <strong style={{ textTransform: "capitalize" }}>{role}:</strong> {desc.split(" — ")[1]}
          </div>
        ))}
      </div>

      <div style={{ fontSize: 13, fontWeight: 600, color: "#1E2A38", marginBottom: 10 }}>Pessoas com acesso</div>
      {loading ? (
        <div style={{ fontSize: 12.5, color: "#8B8577" }}>Carregando...</div>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {users.map((u) => (
            <div key={u.id} style={{ display: "flex", alignItems: "center", gap: 10, background: "#FFFFFF", border: "1px solid #E4DFD1", borderRadius: 6, padding: "10px 14px" }}>
              <div style={{ width: 28, height: 28, borderRadius: "50%", background: "#1E2A38", color: "#FAF9F4", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12, fontWeight: 700, flexShrink: 0 }}>
                {u.name.charAt(0).toUpperCase()}
              </div>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 13, color: "#1E2A38" }}>{u.name}</div>
                <div style={{ fontSize: 11, color: "#8B8577" }}>{u.email}</div>
              </div>
              <span style={{ fontSize: 10.5, fontFamily: "var(--mono)", textTransform: "uppercase", color: "#B8862F", background: "rgba(184,134,47,0.1)", padding: "3px 8px", borderRadius: 20 }}>
                {u.role}
              </span>
              <button onClick={() => handleDelete(u.id)} style={{ background: "none", border: "none", color: "#A8483E", cursor: "pointer" }}>
                <Icon path={ICONS.close} size={14} color="#A8483E" />
              </button>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}
