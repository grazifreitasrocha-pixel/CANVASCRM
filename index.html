          <div><strong style={{ color: "#8B8577", fontWeight: 400 }}>Telefone:</strong> {client.telefone || "-"}</div>
          <div><strong style={{ color: "#8B8577", fontWeight: 400 }}>E-mail:</strong> {client.email || "-"}</div>
          <div><strong style={{ color: "#8B8577", fontWeight: 400 }}>Endereço:</strong> {client.endereco || "-"}</div>
          <div><strong style={{ color: "#8B8577", fontWeight: 400 }}>Representante:</strong> {client.representanteLegal || "-"}</div>
          <div><strong style={{ color: "#8B8577", fontWeight: 400 }}>Vendedor / Executor:</strong> {client.vendedor || "-"} / {client.executor || "-"}</div>
          <div><strong style={{ color: "#8B8577", fontWeight: 400 }}>Regime:</strong> {client.regimeTributario}{client.atividade && (client.regimeTributario === "Simples Nacional" || client.regimeTributario === "Lucro Presumido") ? " — " + client.atividade : ""}</div>
          <div><strong style={{ color: "#8B8577", fontWeight: 400 }}>Funcionários / Notas fiscais:</strong> {client.numFuncionarios || "0"} / {client.numNotasFiscais || "0"} por mês</div>
          <div><strong style={{ color: "#8B8577", fontWeight: 400 }}>Serviços:</strong> {client.servicos.join(", ") || "-"}</div>
          <div><strong style={{ color: "#8B8577", fontWeight: 400 }}>Plano atual:</strong> {client.plano} — {formatMoney(planValue(client))}/mês</div>
          <div><strong style={{ color: "#8B8577", fontWeight: 400 }}>Tradicional:</strong> {formatMoney(client.valorTradicional)}/mês</div>
          <div><strong style={{ color: "#8B8577", fontWeight: 400 }}>Consultiva:</strong> {formatMoney(client.valorConsultiva)}/mês</div>
        </div>

        {client.produtosContratados && client.produtosContratados.length > 0 && (
          <div style={{ marginBottom: 20 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
              <div style={{ fontFamily: "var(--mono)", fontSize: 11, color: "#8B8577", textTransform: "uppercase" }}>
                Produtos contratados
              </div>
              {!readOnly && (
                <button
                  onClick={() => onNewSale(client)}
                  style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 11, color: "#2F6F5E", background: "none", border: "none", cursor: "pointer", padding: 0 }}
                >
                  <Icon path={ICONS.plus} size={11} color="#2F6F5E" />
                  Nova venda
                </button>
              )}
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
              {[...client.produtosContratados].reverse().map((p) => {
                const produtoId = p.produtoId || p.id;
                const catalogProd = pricingConfig ? (pricingConfig.produtos || []).find((cp) => cp.id === produtoId) : null;
                const valorBase = resolveSaleValue(p, client);
                const com = catalogProd ? calcComissao(catalogProd, valorBase) : null;
                return (
                  <div key={p.id} style={{ borderBottom: "1px dashed #E4DFD1", paddingBottom: 8 }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", fontSize: 12.5, color: "#3A362E" }}>
                      <span>{p.nome}</span>
                      <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                        <span style={{ fontFamily: "var(--mono)", color: "#2F6F5E" }}>
                          {formatMoney(valorBase)}
                        </span>
                        {!readOnly && (
                          <button
                            onClick={() => {
                              if (confirm(`Excluir a venda de "${p.nome}"? Isso remove o registro e a comissão associada.`)) {
                                onDeleteSale(client, p.id);
                              }
                            }}
                            title="Excluir venda"
                            style={{ background: "none", border: "none", color: "#A8483E", cursor: "pointer", padding: 0, display: "flex" }}
                          >
                            <Icon path={ICONS.close} size={12} color="#A8483E" />
                          </button>
                        )}
                      </div>
                    </div>
                    {(p.dataVenda || p.vendedor || p.executor) && (
                      <div style={{ fontSize: 10.5, color: "#A6A08F", marginTop: 2 }}>
                        {p.dataVenda ? formatDateBR(p.dataVenda) : ""}
                        {p.vendedor ? ` · Vendedor: ${p.vendedor}` : ""}
                        {p.executor ? ` · Executor: ${p.executor}` : ""}
                      </div>
                    )}
                    {com && com.tipo === "primeiroHonorario" && (
                      <div style={{ fontSize: 11, color: "#B8862F", marginTop: 2 }}>
                        Comissão (1º honorário, {com.pct}%): {formatMoney(com.valor)}
                      </div>
                    )}
                    {com && com.tipo === "papeis" && com.partes.length > 0 && (
                      <div style={{ fontSize: 11, color: "#B8862F", marginTop: 2 }}>
                        Comissão: {com.partes.map((pt) => pt.pct === null ? `${pt.papel} (${formatMoney(pt.valor)})` : `${pt.papel} ${pt.pct}% (${formatMoney(pt.valor)})`).join(" · ")}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
            <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13, fontWeight: 600, color: "#1E2A38", marginTop: 8, paddingTop: 8, borderTop: "1px solid #DAD3C3" }}>
              <span>Total contratado</span>
              <span style={{ fontFamily: "var(--mono)" }}>{formatMoney(contractedTotal(client))}/mês</span>
            </div>
          </div>
        )}

        {(!client.produtosContratados || client.produtosContratados.length === 0) && !readOnly && (
          <button
            onClick={() => onNewSale(client)}
            style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12, color: "#2F6F5E", background: "none", border: "1px dashed #B0AA98", borderRadius: 6, cursor: "pointer", padding: "8px 12px", marginBottom: 20 }}
          >
            <Icon path={ICONS.plus} size={12} color="#2F6F5E" />
            Registrar nova venda
          </button>
        )}

        {client.notas && client.notas.length > 0 && (
          <div style={{ marginBottom: 20 }}>
            <div style={{ fontFamily: "var(--mono)", fontSize: 11, color: "#8B8577", textTransform: "uppercase", marginBottom: 8 }}>
              Notas recentes
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 8, maxHeight: 160, overflowY: "auto" }}>
              {client.notas.map((n) => (
                <div key={n.id} style={{ background: "#FFFFFF", border: "1px solid #DAD3C3", borderRadius: 4, padding: "8px 10px" }}>
                  <div style={{ fontFamily: "var(--mono)", fontSize: 10.5, color: "#B8862F", marginBottom: 3 }}>{n.date}</div>
                  <div style={{ fontSize: 12.5, color: "#3A362E", lineHeight: 1.5 }}>{n.text}</div>
                </div>
              ))}
            </div>
          </div>
        )}

        {client.status !== "ganho" && (
          <Field label="Etapa do funil de vendas">
            <select
              style={inputStyle}
              value={client.stage}
              onChange={(e) => onStageChange(client, e.target.value)}
            >
              {SALES_STAGES.map((s) => (
                <option key={s}>{s}</option>
              ))}
            </select>
          </Field>
        )}

        {!readOnly && (
          <div style={{ display: "flex", flexDirection: "column", gap: 8, marginTop: 14 }}>
            <button
              onClick={() => onShowProposal(client)}
              style={{ display: "flex", alignItems: "center", gap: 9, padding: "11px 14px", background: "#FFFFFF", border: "1px solid #DAD3C3", borderRadius: 6, fontSize: 13.5, cursor: "pointer", textAlign: "left", color: "#1E2A38" }}
            >
              <Icon path={ICONS.doc} size={16} color="#B8862F" />
              Gerar proposta comercial
            </button>
            <button
              onClick={() => onShowContract(client)}
              style={{ display: "flex", alignItems: "center", gap: 9, padding: "11px 14px", background: "#FFFFFF", border: "1px solid #DAD3C3", borderRadius: 6, fontSize: 13.5, cursor: "pointer", textAlign: "left", color: "#1E2A38" }}
            >
              <Icon path={ICONS.contract} size={16} color="#2F6F5E" />
              Gerar contrato de prestação de serviços
            </button>
            {client.status === "ganho" && (
              <button
                onClick={() => onShowTeamMessage(client)}
                style={{ display: "flex", alignItems: "center", gap: 9, padding: "11px 14px", background: "#FFFFFF", border: "1px solid #DAD3C3", borderRadius: 6, fontSize: 13.5, cursor: "pointer", textAlign: "left", color: "#1E2A38" }}
              >
                <Icon path={ICONS.arrowRight} size={16} color="#1E2A38" />
                Mensagem para a equipe (novo cliente)
              </button>
            )}
          </div>
        )}

        {client.status === "aberto" && !readOnly && (
          <div style={{ display: "flex", gap: 10, marginTop: 22, paddingTop: 18, borderTop: "1px solid #DAD3C3" }}>
            <button
              onClick={() => onMarkWon(client)}
              style={{ flex: 1, padding: "10px 14px", background: "#2F6F5E", color: "#FAF9F4", border: "none", borderRadius: 4, fontSize: 13.5, cursor: "pointer" }}
            >
              Marcar como ganho
            </button>
            <button
              onClick={() => onMarkLost(client)}
              style={{ padding: "10px 14px", background: "transparent", color: "#A8483E", border: "1px solid #A8483E", borderRadius: 4, fontSize: 13.5, cursor: "pointer" }}
            >
              Perdido
            </button>
          </div>
        )}

        {client.status === "ganho" && (
          <div style={{ marginTop: 22, paddingTop: 18, borderTop: "1px solid #DAD3C3" }}>
            <div style={{ fontFamily: "var(--mono)", fontSize: 11, color: "#8B8577", textTransform: "uppercase", marginBottom: 6 }}>
              Etapa de integração
            </div>
            <div style={{ fontSize: 14, color: "#2F6F5E", marginBottom: 10 }}>{client.onboardStage}</div>
            <div style={{ fontSize: 12.5, color: "#5A5548", lineHeight: 1.8 }}>
              <div><strong style={{ color: "#8B8577", fontWeight: 400 }}>Data da venda:</strong> {formatDateBR(client.dataVenda)}</div>
              <div><strong style={{ color: "#8B8577", fontWeight: 400 }}>Início dos serviços:</strong> {formatDateBR(client.dataInicioServicos)}</div>
              <div><strong style={{ color: "#8B8577", fontWeight: 400 }}>1ª competência a fechar:</strong> {client.primeiraCompetencia || suggestCompetencia(client.dataInicioServicos) || "a definir"}</div>
            </div>
          </div>
        )}

        {(client.status === "ganho" || client.status === "perdido") && !readOnly && (
          <div style={{ marginTop: 18, paddingTop: 18, borderTop: "1px solid #DAD3C3" }}>
            <button
              onClick={() => onReopen(client)}
              style={{
                display: "flex",
                alignItems: "center",
                justifyContent: "center",
                gap: 8,
                width: "100%",
                padding: "10px 14px",
                background: "transparent",
                color: "#5A5548",
                border: "1px dashed #B0AA98",
                borderRadius: 6,
                fontSize: 13,
                cursor: "pointer",
              }}
            >
              <Icon path={ICONS.arrowRight} size={14} color="#5A5548" />
              Reabrir negociação
            </button>
            <div style={{ fontSize: 11, color: "#A6A08F", marginTop: 6, textAlign: "center" }}>
              {client.status === "ganho"
                ? "Remove o cliente da integração e volta o status para aberto."
                : "Volta o status para aberto, mantendo a etapa do funil."}
            </div>
          </div>
        )}

        {isAdmin && (
          <div style={{ marginTop: 18, paddingTop: 18, borderTop: "1px solid #DAD3C3" }}>
            <div style={{ fontFamily: "var(--mono)", fontSize: 10, color: "#A8483E", textTransform: "uppercase", marginBottom: 8 }}>
              Zona de risco
            </div>
            <button
              onClick={() => {
                if (confirm(`Excluir "${client.razaoSocial || "este cliente"}" permanentemente? Isso remove o cadastro inteiro, todas as vendas e o histórico dele. Essa ação não pode ser desfeita.`)) {
                  onDeleteClient(client);
                }
              }}
              style={{
                display: "flex",
                alignItems: "center",
                justifyContent: "center",
                gap: 8,
                width: "100%",
                padding: "10px 14px",
                background: "transparent",
                color: "#A8483E",
                border: "1px solid #E4C9C5",
                borderRadius: 6,
                fontSize: 13,
                cursor: "pointer",
              }}
            >
              <Icon path={ICONS.close} size={14} color="#A8483E" />
              Excluir cliente permanentemente
            </button>
            <div style={{ fontSize: 11, color: "#A6A08F", marginTop: 6, textAlign: "center" }}>
              Use isso pra corrigir um cadastro feito indevidamente — remove o cliente inteiro, não só uma venda.
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function CRMApp({ currentUser, onLogout }) {
  const [clients, setClients] = useState([]);
  const [view, setView] = useState(currentUser.role === "operacional" ? "integracao" : "vendas");
  const [pricingConfig, setPricingConfig] = useState(defaultPricingConfig());
  const [loaded, setLoaded] = useState(false);
  const [saveStatus, setSaveStatus] = useState("loading"); // loading | saving | saved | error | offline

  const canSeePricing = currentUser.role === "admin";
  const canEditClients = currentUser.role === "admin" || currentUser.role === "comercial";
  const canManageTeam = currentUser.role === "admin";

  // Carrega os dados salvos no servidor assim que o app abre.
  useEffect(() => {
    const loadClients = fetch("/api/clients")
      .then((r) => {
        if (r.status === 401) throw new Error("unauthorized");
        return r.json();
      })
      .then((data) => setClients(data.clients && data.clients.length ? data.clients : SAMPLE_CLIENTS));

    const loadPricing = canSeePricing
      ? fetch("/api/pricing")
          .then((r) => r.json())
          .then((data) => {
            if (data.pricingConfig && Object.keys(data.pricingConfig).length) setPricingConfig(data.pricingConfig);
          })
      : Promise.resolve();

    Promise.all([loadClients, loadPricing])
      .then(() => setSaveStatus("saved"))
      .catch((err) => {
        if (err.message === "unauthorized") return onLogout();
        setSaveStatus("offline");
      })
      .finally(() => setLoaded(true));
  }, []);

  // Salva os clientes automaticamente (com debounce) sempre que algo muda.
  // Time operacional não tem permissão de gravação em lote -- as mudanças de etapa de integração
  // dele passam por um endpoint próprio, restrito, chamado direto nos handlers abaixo.
  useEffect(() => {
    if (!loaded || !canEditClients) return;
    setSaveStatus("saving");
    const t = setTimeout(() => {
      fetch("/api/clients", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ clients }),
      })
        .then((r) => {
          if (r.status === 401) return onLogout();
          if (!r.ok) throw new Error("save failed");
          setSaveStatus("saved");
        })
        .catch(() => setSaveStatus("error"));
    }, 800);
    return () => clearTimeout(t);
  }, [clients, loaded]);

  useEffect(() => {
    if (!loaded || !canSeePricing) return;
    setSaveStatus("saving");
    const t = setTimeout(() => {
      fetch("/api/pricing", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ pricingConfig }),
      })
        .then((r) => {
          if (r.status === 401) return onLogout();
          if (!r.ok) throw new Error("save failed");
          setSaveStatus("saved");
        })
        .catch(() => setSaveStatus("error"));
    }, 800);
    return () => clearTimeout(t);
  }, [pricingConfig, loaded]);

  const [selected, setSelected] = useState(null);
  const [editing, setEditing] = useState(null);
  const [isNewClient, setIsNewClient] = useState(false);
  const [doc, setDoc] = useState(null); // { title, text } - contract
  const [proposalClient, setProposalClient] = useState(null); // client shown in visual proposal
  const [teamMessageClient, setTeamMessageClient] = useState(null);
  const [reportPrintOpen, setReportPrintOpen] = useState(false);
  const [reportFilters, setReportFilters] = useState({ mes: "", produtoId: "", vendedor: "", responsavelIntegracao: "" });
  const [importModalOpen, setImportModalOpen] = useState(false);
  const [newSaleFor, setNewSaleFor] = useState(null);

  const updateClient = (updated) => {
    setClients((prev) => prev.map((c) => (c.id === updated.id ? updated : c)));
    if (selected && selected.id === updated.id) setSelected(updated);
  };

  // Muda só a etapa de integração de um cliente, direto no servidor -- é a única gravação que o
  // time operacional tem permissão de fazer (o endpoint recusa qualquer outro tipo de mudança).
  const pushOnboardStage = (clientId, onboardStage) => {
    fetch(`/api/clients/${clientId}/onboard-stage`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ onboardStage }),
    })
      .then((r) => {
        if (r.status === 401) return onLogout();
        if (r.status === 403) {
          alert("Você não tem permissão para mover clientes na integração.");
          return;
        }
      })
      .catch(() => {});
  };

  const handleNew = () => {
    setEditing(emptyClient());
    setIsNewClient(true);
  };

  const handleImportSale = (novoCliente) => {
    setClients((prev) => [...prev, novoCliente]);
    setImportModalOpen(false);
  };

  const handleAddSale = (novaVenda, observacao) => {
    const c = newSaleFor;
    if (!c) return;
    const notaVenda = {
      id: "n-" + Date.now(),
      date: formatDateBR(novaVenda.dataVenda) + " " + new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }),
      text: `Nova venda: ${novaVenda.nome} — ${formatMoney(novaVenda.valor)} (vendedor: ${novaVenda.vendedor}${novaVenda.executor ? ", executor: " + novaVenda.executor : ""})${observacao ? ". " + observacao : ""}`,
    };
    updateClient({
      ...c,
      produtosContratados: [...(c.produtosContratados || []), novaVenda],
      notas: [notaVenda, ...(c.notas || [])],
    });
    setNewSaleFor(null);
  };

  const handleDeleteSale = (c, saleId) => {
    updateClient({
      ...c,
      produtosContratados: (c.produtosContratados || []).filter((p) => p.id !== saleId),
    });
  };

  const handleSaveEdit = (data) => {
    setClients((prev) => {
      const exists = prev.some((c) => c.id === data.id);
      return exists ? prev.map((c) => (c.id === data.id ? data : c)) : [...prev, data];
    });
    setSelected((prev) => (prev && prev.id === data.id ? data : prev));
    setEditing(null);
    setIsNewClient(false);
  };

  const teamSuggestions = [...new Set(clients.flatMap((c) => [c.vendedor, c.executor, c.responsavelComercial].filter(Boolean)))];

  const [teamUsers, setTeamUsers] = useState([]);
  const [googleStatus, setGoogleStatus] = useState({ connected: false, email: null, loaded: false });

  useEffect(() => {
    fetch("/api/users/basic")
      .then((r) => r.json())
      .then((data) => setTeamUsers(data.users || []))
      .catch(() => {});
    refreshGoogleStatus();
  }, []);

  function refreshGoogleStatus() {
    fetch("/api/google/status")
      .then((r) => r.json())
      .then((data) => setGoogleStatus({ ...data, loaded: true }))
      .catch(() => setGoogleStatus({ connected: false, email: null, loaded: true }));
  }

  const handleConnectGoogle = () => {
    const win = window.open("/api/google/connect", "google-connect", "width=520,height=650");
    const timer = setInterval(() => {
      if (win && win.closed) {
        clearInterval(timer);
        refreshGoogleStatus();
      }
    }, 700);
  };

  const handleDisconnectGoogle = () => {
    fetch("/api/google/disconnect", { method: "POST" }).then(() => refreshGoogleStatus());
  };

  const handleSyncGoogle = async (c) => {
    try {
      const res = await fetch("/api/google/events", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          responsavelUserId: c.proximaAcaoResponsavelId,
          title: `${c.razaoSocial || "Cliente"} — ${c.proximaAcaoDescricao || "Próxima ação"}`,
          description: `Próxima ação registrada no CRM para ${c.razaoSocial || "cliente"}.`,
          date: c.proximaAcaoData,
          existingEventId: c.proximaAcaoGoogleEventId || undefined,
        }),
      });
      const data = await res.json();
      if (!res.ok) {
        alert(data.error || "Não foi possível sincronizar com o Google Agenda.");
        return;
      }
      updateClient({ ...c, proximaAcaoGoogleEventId: data.eventId });
    } catch {
      alert("Não foi possível sincronizar com o Google Agenda.");
    }
  };

  const handleMarkWon = (c) => {
    const dataVenda = c.dataVenda || todayISO();
    const dataInicioServicos = c.dataInicioServicos || todayISO();
    const primeiraCompetencia = c.primeiraCompetencia || suggestCompetencia(dataInicioServicos);
    updateClient({ ...c, status: "ganho", onboardStage: ONBOARD_STAGES[0], dataVenda, dataInicioServicos, primeiraCompetencia });
  };

  const handleMarkLost = (c) => {
    updateClient({ ...c, status: "perdido" });
    setSelected(null);
  };

  const handleReopen = (c) => {
    updateClient({ ...c, status: "aberto", onboardStage: null });
  };

  const handleDeleteClient = (c) => {
    fetch(`/api/clients/${c.id}`, { method: "DELETE" })
      .then((r) => {
        if (r.status === 401) return onLogout();
        if (r.status === 403) {
          alert("Só administradores podem excluir clientes.");
          return;
        }
      })
      .catch(() => {});
    setClients((prev) => prev.filter((cl) => cl.id !== c.id));
    setSelected(null);
  };

  const handleAdvanceOnboard = (c) => {
    const idx = ONBOARD_STAGES.indexOf(c.onboardStage);
    const next = ONBOARD_STAGES[Math.min(idx + 1, ONBOARD_STAGES.length - 1)];
    updateClient({ ...c, onboardStage: next });
    pushOnboardStage(c.id, next);
  };

  const handleDistratar = (c) => {
    updateClient({ ...c, onboardStage: ONBOARD_DISTRATADO });
    pushOnboardStage(c.id, ONBOARD_DISTRATADO);
  };

  const handleMoveStage = (clientId, stage) => {
    const c = clients.find((cl) => cl.id === clientId);
    if (c && c.stage !== stage) updateClient({ ...c, stage });
  };

  const handleMoveOnboardStage = (clientId, onboardStage) => {
    const c = clients.find((cl) => cl.id === clientId);
    if (c && c.status === "ganho" && c.onboardStage !== onboardStage) {
      updateClient({ ...c, onboardStage });
      pushOnboardStage(clientId, onboardStage);
    }
  };

  const handleMoveExecucaoStage = (clientId, saleId, etapaExecucao) => {
    const c = clients.find((cl) => cl.id === clientId);
    if (!c) return;
    updateClient({
      ...c,
      produtosContratados: (c.produtosContratados || []).map((p) => (p.id === saleId ? { ...p, etapaExecucao } : p)),
    });
  };

  return (
    <div
      style={{
        "--serif": "Georgia, 'Iowan Old Style', 'Times New Roman', serif",
        "--sans": "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif",
        "--mono": "'SFMono-Regular', Consolas, 'IBM Plex Mono', Menlo, monospace",
        background: "#FAF9F4",
        minHeight: "100vh",
        fontFamily: "var(--sans)",
        display: "flex",
      }}
    >
      <style>{`

      <div className="app-shell" style={{ width: 210, borderRight: "1px solid #DAD3C3", padding: "26px 16px", flexShrink: 0, background: "#FCFBF7", position: "relative" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 20, padding: "0 4px" }}>
          <div
            style={{
              width: 34,
              height: 34,
              borderRadius: "50%",
              border: "1.5px dashed #B8862F",
              display: "flex",
              alignItems: "center",
              justifyContent: "center",
              flexShrink: 0,
              transform: "rotate(-6deg)",
            }}
          >
            <span style={{ fontFamily: "var(--serif)", fontSize: 15, color: "#B8862F", fontWeight: 700 }}>C</span>
          </div>
          <div>
            <div style={{ fontFamily: "var(--serif)", fontSize: 15.5, color: "#1E2A38", lineHeight: 1.15 }}>Integração</div>

          </div>
        </div>

        <div style={{ background: "#FFFFFF", border: "1px solid #E4DFD1", borderRadius: 8, padding: "9px 10px", marginBottom: 20, display: "flex", alignItems: "center", gap: 8 }}>
          <div style={{ width: 26, height: 26, borderRadius: "50%", background: "#1E2A38", color: "#FAF9F4", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 11, fontWeight: 700, flexShrink: 0 }}>
            {currentUser.name.charAt(0).toUpperCase()}
          </div>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ fontSize: 11.5, color: "#1E2A38", fontWeight: 600, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{currentUser.name}</div>
            <div style={{ fontSize: 9.5, color: "#8B8577", fontFamily: "var(--mono)", textTransform: "capitalize" }}>{currentUser.role}</div>
          </div>
          <button
            onClick={onLogout}
            title="Sair"
            style={{ background: "none", border: "none", cursor: "pointer", color: "#A8483E", fontSize: 11, padding: 2 }}
          >
            <Icon path={ICONS.close} size={13} color="#A8483E" />
          </button>
        </div>

        {googleStatus.loaded && (
          <button
            onClick={googleStatus.connected ? handleDisconnectGoogle : handleConnectGoogle}
            title={googleStatus.connected ? `Conectado: ${googleStatus.email}` : "Conectar Google Agenda"}
            style={{
              display: "flex",
              alignItems: "center",
              gap: 7,
              width: "100%",
              padding: "8px 10px",
              marginBottom: 20,
              background: googleStatus.connected ? "rgba(47,111,94,0.08)" : "#FFFFFF",
              border: "1px solid " + (googleStatus.connected ? "#B9D6CB" : "#DAD3C3"),
              borderRadius: 8,
              fontSize: 11,
              color: googleStatus.connected ? "#2F6F5E" : "#5A5548",
              cursor: "pointer",
            }}
          >
            <span style={{ width: 6, height: 6, borderRadius: "50%", background: googleStatus.connected ? "#2F6F5E" : "#B0AA98", flexShrink: 0 }} />
            {googleStatus.connected ? "Google Agenda conectada" : "Conectar Google Agenda"}
          </button>
        )}

        <div style={{ fontFamily: "var(--mono)", fontSize: 10, color: "#A6A08F", letterSpacing: "0.06em", padding: "0 10px", marginBottom: 8 }}>
          NAVEGAÇÃO
        </div>
        {[
          { key: "vendas", label: "Funil de vendas", icon: ICONS.funnel, activeColor: "#B8862F", roles: ["admin", "comercial"] },
          { key: "acoes", label: "Próximas ações", icon: ICONS.calculator, activeColor: "#A8483E", roles: ["admin", "comercial"] },
          { key: "integracao", label: "Integração", icon: ICONS.gear, activeColor: "#4FD9A8", roles: ["admin", "comercial", "operacional"] },
          { key: "execucao", label: "Execução de serviços", icon: ICONS.contract, activeColor: "#C9A15A", roles: ["admin", "comercial", "operacional"] },
          { key: "precificacao", label: "Precificação", icon: ICONS.calculator, activeColor: "#B8862F", roles: ["admin"] },
          { key: "relatorios", label: "Relatórios", icon: ICONS.doc, activeColor: "#5A6B7A", roles: ["admin", "comercial"] },
          { key: "historico", label: "Histórico", icon: ICONS.arrowRight, activeColor: "#5A6B7A", roles: ["admin", "comercial"] },
          { key: "equipe", label: "Equipe", icon: ICONS.check, activeColor: "#2F6F5E", roles: ["admin"] },
        ]
          .filter((item) => item.roles.includes(currentUser.role))
          .map((item) => (
            <button
              key={item.key}
              onClick={() => setView(item.key)}
              style={{
                display: "flex",
                alignItems: "center",
                gap: 10,
                width: "100%",
                textAlign: "left",
                padding: "9px 10px",
                marginBottom: 4,
                background: view === item.key ? "#1E2A38" : "transparent",
                color: view === item.key ? "#FAF9F4" : "#3A362E",
                border: "none",
                borderRadius: 6,
                fontSize: 13,
                fontWeight: 500,
                cursor: "pointer",
              }}
            >
              <Icon path={item.icon} size={15} color={view === item.key ? item.activeColor : "#8B8577"} />
              {item.label}
            </button>
          ))}

        <div style={{ position: "absolute", bottom: 20, left: 16, right: 16, fontSize: 10.5, fontFamily: "var(--mono)", display: "flex", alignItems: "center", gap: 6, color: "#A6A08F" }}>
          <span
            style={{
              width: 6,
              height: 6,
              borderRadius: "50%",
              background:
                saveStatus === "saved" ? "#2F6F5E" : saveStatus === "saving" ? "#B8862F" : saveStatus === "error" ? "#A8483E" : "#B0AA98",
              flexShrink: 0,
            }}
          />
          {saveStatus === "loading" && "Carregando..."}
          {saveStatus === "saving" && "Salvando..."}
          {saveStatus === "saved" && "Salvo no servidor"}
          {saveStatus === "error" && "Erro ao salvar"}
          {saveStatus === "offline" && "Sem conexão com o servidor"}
        </div>
      </div>

      <div className="app-shell" style={{ flex: 1, padding: "28px 32px", overflowX: "auto" }}>
        {view === "vendas" && currentUser.role !== "operacional" && <SalesBoard clients={clients} onOpen={setSelected} onNew={handleNew} onImport={() => setImportModalOpen(true)} onMoveStage={handleMoveStage} onMarkWon={handleMarkWon} onMarkLost={handleMarkLost} />}
        {view === "acoes" && currentUser.role !== "operacional" && <NextActionsBoard clients={clients} onOpen={setSelected} />}
        {view === "integracao" && <OnboardBoard clients={clients} onOpen={setSelected} onAdvance={handleAdvanceOnboard} onMoveOnboardStage={handleMoveOnboardStage} onDistratar={handleDistratar} />}
        {view === "execucao" && <ExecucaoBoard clients={clients} onOpen={setSelected} onMoveStage={handleMoveExecucaoStage} />}
        {view === "precificacao" && canSeePricing && <PricingBoard pricingConfig={pricingConfig} onChange={setPricingConfig} />}
        {view === "relatorios" && currentUser.role !== "operacional" && <ReportsBoard clients={clients} pricingConfig={pricingConfig} onOpenPrint={() => setReportPrintOpen(true)} filters={reportFilters} onFiltersChange={setReportFilters} />}
        {view === "historico" && currentUser.role !== "operacional" && <HistoryBoard clients={clients} onOpen={setSelected} />}
        {view === "equipe" && canManageTeam && <EquipeBoard />}
      </div>

      {selected && (
        <ClientDetail
          client={selected}
          pricingConfig={pricingConfig}
          readOnly={currentUser.role === "operacional"}
          onClose={() => setSelected(null)}
          onEdit={(c) => {
            setEditing(c);
            setIsNewClient(false);
          }}
          onMarkWon={handleMarkWon}
          onMarkLost={handleMarkLost}
          onReopen={handleReopen}
          onStageChange={(c, stage) => updateClient({ ...c, stage })}
          onShowProposal={(c) => {
            setProposalClient(c);
            updateClient({ ...c, propostaGerada: true });
          }}
          onShowContract={(c) => {
            setDoc({ title: "Contrato de prestação de serviços", text: buildContractText(c) });
            updateClient({ ...c, contratoGerado: true });
          }}
          onShowTeamMessage={(c) => setTeamMessageClient(c)}
          onNewSale={(c) => setNewSaleFor(c)}
          onDeleteSale={handleDeleteSale}
          onDeleteClient={handleDeleteClient}
          onSyncGoogle={handleSyncGoogle}
          isAdmin={currentUser.role === "admin"}
        />
      )}

      {editing && (
        <ClientFormPanel
          client={editing}
          isNew={isNewClient}
          pricingConfig={pricingConfig}
          teamSuggestions={teamSuggestions}
          teamUsers={teamUsers}
          onClose={() => {
            setEditing(null);
            setIsNewClient(false);
          }}
          onSave={handleSaveEdit}
        />
      )}

      {doc && <DocumentModal title={doc.title} text={doc.text} onClose={() => setDoc(null)} />}
      {proposalClient && <ProposalModal client={proposalClient} pricingConfig={pricingConfig} onClose={() => setProposalClient(null)} />}
      {teamMessageClient && <TeamMessageModal client={teamMessageClient} onClose={() => setTeamMessageClient(null)} />}
      {reportPrintOpen && <ReportPrintModal clients={clients} pricingConfig={pricingConfig} filters={reportFilters} onClose={() => setReportPrintOpen(false)} />}
      {importModalOpen && (
        <ImportSaleModal
          onClose={() => setImportModalOpen(false)}
          onImport={handleImportSale}
          pricingConfig={pricingConfig}
          teamSuggestions={teamSuggestions}
        />
      )}
      {newSaleFor && (
        <NewSaleModal
          client={newSaleFor}
          onClose={() => setNewSaleFor(null)}
          onAddSale={handleAddSale}
          pricingConfig={pricingConfig}
          teamSuggestions={teamSuggestions}
        />
      )}
    </div>
  );
}

// ---- Autenticação: telas de configuração inicial e login ----

function AuthShell({ children }) {
  return (
    <div
      style={{
        "--serif": "Georgia, 'Iowan Old Style', 'Times New Roman', serif",
        "--sans": "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif",
        "--mono": "'SFMono-Regular', Consolas, 'IBM Plex Mono', Menlo, monospace",
        background: "#FAF9F4",
        minHeight: "100vh",
        fontFamily: "var(--sans)",
        display: "flex",
        alignItems: "center",
        justifyContent: "center",
        padding: 20,
      }}
    >
      <div style={{ width: 380, maxWidth: "100%", background: "#FFFFFF", border: "1px solid #DAD3C3", borderRadius: 10, padding: "32px 28px" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 24 }}>
          <div
            style={{
              width: 36,
              height: 36,
              borderRadius: "50%",
              border: "1.5px dashed #B8862F",
              display: "flex",
              alignItems: "center",
              justifyContent: "center",
              transform: "rotate(-6deg)",
            }}
          >
            <span style={{ fontFamily: "var(--serif)", fontSize: 16, color: "#B8862F", fontWeight: 700 }}>C</span>
          </div>
          <div>
            <div style={{ fontFamily: "var(--serif)", fontSize: 17, color: "#1E2A38", lineHeight: 1.15 }}>Integração</div>
            <div style={{ fontFamily: "var(--mono)", fontSize: 9.5, color: "#B8862F", letterSpacing: "0.06em" }}>ESCRITÓRIO CONTÁBIL</div>
          </div>
        </div>
        {children}
      </div>
    </div>
  );
}

function SetupScreen({ onDone }) {
  const [name, setName] = useState("");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);

  const handleSubmit = async () => {
    setError("");
    setLoading(true);
    try {
      const res = await fetch("/api/auth/setup", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, email, password }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Não foi possível criar a conta.");
      onDone(data.user);
    } catch (err) {
      setError(err.message);
    } finally {
      setLoading(false);
    }
  };

  return (
    <AuthShell>
      <div style={{ fontFamily: "var(--serif)", fontSize: 19, color: "#1E2A38", marginBottom: 4 }}>Primeiro acesso</div>
      <div style={{ fontSize: 12.5, color: "#8B8577", marginBottom: 20, lineHeight: 1.5 }}>
        Ainda não existe nenhuma conta configurada. Crie a conta de administrador — ela poderá convidar o resto da equipe depois.
      </div>
      <Field label="Nome">
        <input style={inputStyle} value={name} onChange={(e) => setName(e.target.value)} />
      </Field>
      <Field label="E-mail">
        <input style={inputStyle} type="email" value={email} onChange={(e) => setEmail(e.target.value)} />
      </Field>
      <Field label="Senha">
        <input style={inputStyle} type="password" value={password} onChange={(e) => setPassword(e.target.value)} placeholder="Mínimo 6 caracteres" />
      </Field>
      {error && <div style={{ fontSize: 12, color: "#A8483E", marginBottom: 12 }}>{error}</div>}
      <button
        onClick={handleSubmit}
        disabled={loading}
        style={{ width: "100%", padding: "11px 14px", background: "#1E2A38", color: "#FAF9F4", border: "none", borderRadius: 6, fontSize: 14, cursor: "pointer", marginTop: 4 }}
      >
        {loading ? "Criando..." : "Criar conta de administrador"}
      </button>
    </AuthShell>
  );
}

function LoginScreen({ onDone }) {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);

  const handleSubmit = async () => {
    setError("");
    setLoading(true);
    try {
      const res = await fetch("/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Não foi possível entrar.");
      onDone(data.user);
    } catch (err) {
      setError(err.message);
    } finally {
      setLoading(false);
    }
  };

  return (
    <AuthShell>
      <div style={{ fontFamily: "var(--serif)", fontSize: 19, color: "#1E2A38", marginBottom: 20 }}>Entrar</div>
      <Field label="E-mail">
        <input style={inputStyle} type="email" value={email} onChange={(e) => setEmail(e.target.value)} onKeyDown={(e) => e.key === "Enter" && handleSubmit()} />
      </Field>
      <Field label="Senha">
        <input style={inputStyle} type="password" value={password} onChange={(e) => setPassword(e.target.value)} onKeyDown={(e) => e.key === "Enter" && handleSubmit()} />
      </Field>
      {error && <div style={{ fontSize: 12, color: "#A8483E", marginBottom: 12 }}>{error}</div>}
      <button
        onClick={handleSubmit}
        disabled={loading}
        style={{ width: "100%", padding: "11px 14px", background: "#1E2A38", color: "#FAF9F4", border: "none", borderRadius: 6, fontSize: 14, cursor: "pointer", marginTop: 4 }}
      >
        {loading ? "Entrando..." : "Entrar"}
      </button>
      <div style={{ fontSize: 11.5, color: "#A6A08F", marginTop: 14, textAlign: "center" }}>
        Não tem conta? Peça ao administrador do escritório para criar seu acesso em "Equipe".
      </div>
    </AuthShell>
  );
}

function App() {
  const [status, setStatus] = useState("checking"); // checking | needsSetup | needsLogin | ready
  const [currentUser, setCurrentUser] = useState(null);

  useEffect(() => {
    fetch("/api/auth/me")
      .then((r) => {
        if (r.status === 401) throw new Error("no session");
        return r.json();
      })
      .then((data) => {
        setCurrentUser(data.user);
        setStatus("ready");
      })
      .catch(() => {
        fetch("/api/auth/needs-setup")
          .then((r) => r.json())
          .then((data) => setStatus(data.needsSetup ? "needsSetup" : "needsLogin"))
          .catch(() => setStatus("needsLogin"));
      });
  }, []);

  const handleAuthed = (user) => {
    setCurrentUser(user);
    setStatus("ready");
  };

  const handleLogout = () => {
    fetch("/api/auth/logout", { method: "POST" }).finally(() => {
      setCurrentUser(null);
      setStatus("needsLogin");
    });
  };

  if (status === "checking") {
    return (
      <AuthShell>
        <div style={{ fontSize: 13, color: "#8B8577", textAlign: "center" }}>Carregando...</div>
      </AuthShell>
    );
  }
  if (status === "needsSetup") return <SetupScreen onDone={handleAuthed} />;
  if (status === "needsLogin") return <LoginScreen onDone={handleAuthed} />;
  return <CRMApp currentUser={currentUser} onLogout={handleLogout} />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
