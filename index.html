Parágrafo Quinto - A contratante se responsabiliza em fornecer à contratada todos os materiais necessários para o atendimento das suas demandas específicas. As despesas com impressos, autenticações, reconhecimento de firmas, custas, emolumentos e taxas exigidas pelos serviços públicos, entre outras específicas da empresa, poderão ser adiantadas pela contratada e deverão ser reembolsadas pela contratante ao final de cada mês, mediante apresentação dos comprovantes.

VI - DOS SERVIÇOS EXTRAORDINÁRIOS

Os serviços contábeis não especificados nas obrigações da contratada são considerados serviços extraordinários, devendo ser orçados em separado e aprovados previamente pela contratante, tomando como base a tabela referencial de honorários contábeis atualizada do Sindicato dos Contabilistas no Estado de Goiás (SCESGO).

VII - DAS ALTERAÇÕES LEGAIS E NOVAS OBRIGAÇÕES ACESSÓRIAS

A CONTRATADA não será responsável pelo cumprimento de novas obrigações acessórias, declarações, sistemas ou exigências legais instituídas após a assinatura deste contrato, seja por meio de legislação federal, estadual ou municipal, ou ainda por mudanças substanciais no regime tributário nacional. Tais alterações, quando aplicáveis, serão avaliadas em conjunto entre as partes, devendo ser formalizada contratação adicional específica, com revisão proporcional dos honorários. A CONTRATADA compromete-se a informar tempestivamente à CONTRATANTE sobre alterações legais que afetem diretamente as rotinas contábeis, fiscais, trabalhistas ou previdenciárias.

VIII - DA VIGÊNCIA DO CONTRATO

O presente contrato tem vigência por período indeterminado, considerando que a parceria entre as partes teve início em ${c.dataVenda?formatDateBR(c.dataVenda):todayLong()}.

IX - DA RESCISÃO DO CONTRATO

O presente contrato poderá ser rescindido por qualquer das partes, depois de transcorridos seis meses de vigência, através de notificação escrita ao outro contratante, com antecedência mínima de sessenta dias, não existindo, nesta hipótese, qualquer incidência de multa.

Parágrafo Primeiro - A denúncia do contrato por qualquer das partes não a desobriga de cumprir seus deveres e exigir seus direitos durante o período do aviso prévio.

Parágrafo Segundo - A parte que não comunicar por escrito a rescisão ou efetuá-la de maneira sumária, desrespeitando o prazo de aviso prévio, ficará obrigada ao pagamento de multa compensatória no valor equivalente a dois honorários mensais vigentes à época da rescisão.

Parágrafo Terceiro - O contrato somente poderá ser encerrado quando todas as obrigações devidas à contratada estiverem quitadas, ficando a contratada autorizada a reter as informações, relatórios e documentos até que seja feito um acordo para o pagamento das obrigações previstas em contrato.

Parágrafo Quarto - Encerrado o contrato e quitadas todas as obrigações, a contratada colocará à disposição da contratante toda a documentação em seu poder, assim como prestará os esclarecimentos necessários à continuidade da prestação de serviços.

Parágrafo Quinto - Ocorrendo a transferência dos serviços para outra empresa contábil, a contratante deverá informar à contratada, por escrito, seu nome, endereço, nome do responsável e número da inscrição junto ao Conselho Regional de Contabilidade.

Parágrafo Sexto - A mudança de sócios, falência ou recuperação judicial da contratante faculta a rescisão do presente pela contratada, independentemente de notificação judicial ou extrajudicial.

X - DO FORO DE ELEIÇÃO

Os contratantes submeterão eventuais litígios oriundos do presente contrato à Comarca de Caldas Novas/GO, com renúncia expressa a todas as demais.
